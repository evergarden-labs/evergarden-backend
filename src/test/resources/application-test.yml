# 테스트 프로필
#
# 접속 정보는 Testcontainers가 채운다(ContainerConfig의 @ServiceConnection).
# 여기에는 운영 설정이 환경변수를 요구해서 그대로 두면 안 되는 값만 덮어쓴다.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/replaced-by-testcontainers
    username: test
    password: test

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      ssl:
        enabled: false

  # 스키마는 마이그레이션이 만들고, 엔티티와 맞는지 Hibernate가 검사한다
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret-key: test-only-secret-key-not-used-anywhere-else-0123456789

storage:
  s3:
    bucket: test-bucket
    region: ap-northeast-2

oauth:
  google:
    client-id: test-client-id
  kakao:
    app-id: test-app-id

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
