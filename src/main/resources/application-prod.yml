# 운영 프로필
# 공통 설정은 application.yml에 있다. 여기에는 dev와 다른 것만 둔다.

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    disable-swagger-default-url: true    # 운영에선 예제 URL을 막는다
  show-actuator: false                   # 운영에선 actuator를 문서에 노출하지 않는다

# Logging
logging:
  level:
    root: INFO
    org.springframework.data.redis: WARN
    io.lettuce: WARN
