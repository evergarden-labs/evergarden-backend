# 공통 설정
# 프로필별로 다른 것만 application-dev.yml / application-prod.yml에 둔다.
# 여기를 고치면 두 프로필에 모두 적용된다.

# Spring
spring:
  # Application
  application:
    name: evergarden-backend

  # Profile
  profiles:
    active: dev

  # 인메모리 기본 계정을 만들지 않는다.
  # 커스텀 SecurityFilterChain을 정의해도 이 자동설정은 물러나지 않아,
  # 기동할 때마다 "Using generated security password: ..."를 찍고
  # 쓰이지도 않는 user 계정을 하나 만들어 둔다. 인증은 JWT로만 한다(ADR-010)
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false

  # Jackson
  jackson:
    time-zone: Asia/Seoul

  # DataSource
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    # HikariCP
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway — ddl-auto=validate이므로 스키마는 마이그레이션으로 만든다
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 30000

      lettuce:
        pool:
          max-active: 8
          max-wait: 30s
        shutdown-timeout: 200ms

# 로그인 없이 개발하기 위한 스위치. true면 토큰 없는 요청을 고정 사용자로 통과시킨다
# (JwtAuthenticationFilter, DevUserSeeder). 기본은 false — 켜는 곳은 application-dev.yml뿐이고
# application-prod.yml은 이 값을 명시적으로 false로 고정해 둔다
dev-auth:
  enabled: false

# JWT
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: 30
  refresh-token-expiration-days: 7

# 소셜 로그인 (ADR-010)
# 앱이 SDK로 받은 액세스 토큰을 서버가 제공자 API로 검증한다.
# 서버가 로그인 페이지로 리다이렉트하지 않으므로 redirect-uri·client-secret이 필요 없다.
#
# 구글·카카오는 프로필(userinfo) 엔드포인트를 따로 부르지 않는다. 토큰 검증 엔드포인트의
# 응답에 이미 우리 앱이 발급한 토큰인지(aud·app_id)와 사용자 식별자(sub·id)가 같이 들어 있어,
# 한 번 더 부를 이유가 없다 — 어차피 닉네임 등 프로필 정보는 소셜 계정에서 가져오지 않는다(ADR-050).
oauth:
  google:
    token-info-uri: https://oauth2.googleapis.com/tokeninfo
    client-id: ${GOOGLE_CLIENT_ID}      # 토큰의 aud가 우리 앱인지 확인하는 데 쓴다
  kakao:
    token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
    app-id: ${KAKAO_APP_ID}             # 토큰의 app_id가 우리 앱인지 확인하는 데 쓴다
  naver:
    user-info-uri: https://openapi.naver.com/v1/nid/me
    # 네이버는 토큰이 우리 앱에 발급된 것인지 확인할 공개 엔드포인트가 없다.
    # userinfo 호출이 성공하면 유효한 토큰으로 간주한다 (제한 사항)

# 스토리지 (ADR-023 · ADR-056)
# 앱이 presigned URL로 S3에 직접 올리고, 내려받을 때도 presigned URL을 쓴다.
# 버킷은 비공개이고 파일은 서버를 거치지 않는다.
storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-upload-url-expiry-minutes: 10
    presigned-download-url-expiry-minutes: 60
  limits:
    image-max-bytes: 10485760           # 10MB
    video-max-bytes: 209715200          # 200MB
    video-max-duration-seconds: 180     # 3분
    max-files-per-request: 20

# 실시간 공동 편집 (ARCH-12 · ADR-051)
# 앱이 CONNECT할 WebSocket 주소. 프로필별로 다르므로 여기엔 기본값을 두지 않는다
websocket:
  public-url: ${WEBSOCKET_URL}

# 콘텐츠랩 관광정보 연동 (ADR-004)
# 매 요청마다 직접 부르지 않고, 배치로 받아 places/regions에 적재해 둔 뒤 그걸 조회한다.
tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_SERVICE_KEY}

# 카카오 로컬 API. TourAPI 법정동코드엔 좌표가 없어서, 지역명을 좌표로 바꾸는 데만 쓴다.
# oauth.kakao(로그인 토큰 검증)와는 목적이 달라 REST API 키를 따로 둔다.
kakao-local:
  base-url: https://dapi.kakao.com/v2/local
  rest-api-key: ${KAKAO_LOCAL_API_KEY}

# 정책 값 (ADR-016 · ADR-018 · ADR-044)
policy:
  region-visit:
    max-accuracy-meters: 100            # 이 값을 넘으면 인증 거절
    growth-cooldown-days: 7             # 같은 지역 재인증 시 성장 반영 간격
  feed:
    popular-window-days: 30             # 인기 피드에 넣을 게시물의 최대 경과일
  sanction:
    warning-threshold: 1                # 유효 신고 누적 1회 → 경고
    block-threshold: 3                  # 유효 신고 누적 3회 → 차단
  withdrawal:
    restore-grace-days: 30              # 탈퇴 후 복구 가능 기간 (ADR-054)
  nearby-places:
    radius-meters: 5000                 # 주변 추천 반경 (ADR-042)

# Swagger / OpenAPI — 프로필별로 다른 두 값은 각 프로필 파일에 있다
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

  api-docs:
    enabled: true
    path: /v3/api-docs

  default-consumes-media-type: application/json
