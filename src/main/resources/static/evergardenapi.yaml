        - $ref: '#/components/parameters/ArchiveItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveItemUpdateRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ArchiveItem' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 배치 값이 범위를 벗어남
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` · `NOT_COLLABORATOR` · `COLLABORATION_CLOSED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND` · `ARCHIVE_ITEM_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

