      description: |
        아카이브에서 항목 하나를 뺍니다. 사진·영상 자체(`media`)는 지워지지 않습니다.
        남은 항목들의 순서는 서버가 다시 채웁니다.

        대표 사진으로 지정된 항목을 빼면 대표 사진이 `null`이 됩니다.
      parameters:
