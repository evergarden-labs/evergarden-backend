      description: |
        아카이브에 배치된 사진 중 하나를 대표로 삼습니다.
        목록과 커뮤니티 게시물의 썸네일로 쓰입니다.

        영상은 대표로 지정할 수 없습니다 — ARCH-08이 "사진 중 하나"입니다.
      parameters:
