                  data: { $ref: '#/components/schemas/ArchiveDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 남의 아카이브이거나 남의 일정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND` · `TRIP_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `TRIP_ARCHIVE_ALREADY_LINKED` — 그 일정에 이미 다른 아카이브가 연결됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [아카이브]
      operationId: unlinkTripFromArchive
      summary: 여행 일정 연결 해제
      x-user-stories: [ARCH-17]
      description: |
        연결만 끊습니다. **아카이브도 일정도 삭제되지 않습니다**(ADR-001).
        연결된 일정이 없으면 아무 일도 일어나지 않고 `200`입니다.
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      responses:
        '200':
          description: 해제 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ArchiveDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/duplicate:
    post:
      tags: [아카이브]
      operationId: duplicateArchive
      summary: 공동 편집 아카이브 복제
      x-user-stories: [ARCH-15]
      description: |
        함께 만든 아카이브를 **내용까지 통째로** 내 아카이브로 복사합니다.
        사진·영상·배치가 모두 복사되며, `originArchiveId`에 원본이 남습니다(ADR-005).

        커뮤니티에서 가져오는 ARCH-16과 다릅니다 —
        저쪽은 **틀만** 복제하고 사진은 가져오지 않습니다.
        내가 함께 만든 기록이라 내용까지 가져갈 수 있는 것입니다.

        > **[가정] 공동 편집 종료 전에도 복제할 수 있게 두었습니다.**
        > ARCH-15는 "공동 편집 종료 후 복제를 선택한다"로 되어 있지만,
        > 이는 화면 흐름이지 서버가 막아야 할 제약인지는 분명하지 않습니다.
        > 종료 전 복제를 막으려면 오류 코드를 새로 만들어야 합니다. 결정 주체: 기획.
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: [string, 'null']
                  maxLength: 60
                  description: 복사본 이름. 생략하면 원본 이름을 씁니다
      responses:
        '200':
          description: 복제 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ArchiveDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` · `NOT_COLLABORATOR` — 이 아카이브에 참여한 적이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /posts/{postId}/archive/import:
    post:
      tags: [아카이브]
      operationId: importSharedArchive
      summary: 공유 아카이브 가져오기
      x-user-stories: [ARCH-16]
      description: |
        커뮤니티 게시물에 공유된 아카이브의 **틀만** 내 아카이브로 복제합니다.

        가져오는 것: 테마, 대표 색상, 항목들의 배치와 순서
        가져오지 않는 것: **사진·영상, 지역, 캡션**

        빈 자리만 있는 아카이브가 만들어지고 내 사진으로 채우게 됩니다.
        `originArchiveId`에 원본이 남습니다(ADR-005).
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: 내 아카이브 이름. ARCH-16에서 사용자가 입력합니다
      responses:
        '200':
          description: 복제 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ArchiveDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 이름 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `POST_NOT_FOUND` — 게시물이 없거나 삭제됨
            `ARCHIVE_NOT_FOUND` — 게시물에 공유된 아카이브가 없거나 원본이 삭제됨(ADR-002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ------------------------------------------------------------------
  # 공동 편집
  # ------------------------------------------------------------------

  /archives/{archiveId}/collaborators:
    post:
      tags: [공동 편집]
      operationId: inviteCollaborator
      summary: 공동 편집 초대
      x-user-stories: [ARCH-10]
      description: |
        아카이브에 함께 만들 사람을 초대합니다.
        초대받은 사용자에게 알림이 갑니다(NOTI-02).
        상대가 수락해야 편집 권한이 생깁니다(ARCH-11).

        아카이브의 `collaborationStatus`가 `NONE`이면 이 호출로 `OPEN`이 됩니다.

        초대할 사람은 `GET /users/search`로 닉네임을 검색해 고릅니다(ADR-024).
        링크·코드로 초대하는 방식은 채택하지 않았으므로
        **동행자가 이미 에버가든에 가입해 있어야 초대할 수 있습니다.**
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '200':
          description: 초대 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collaborator' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 소유자만 초대할 수 있습니다
            `COLLABORATION_CLOSED` — 이미 종료된 공동 편집
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND` · `USER_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ALREADY_INVITED` — 이미 초대한 사용자
            `ALREADY_COLLABORATOR` — 이미 참여 중인 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/collaborators/me/accept:
    post:
      tags: [공동 편집]
      operationId: acceptCollaboration
      summary: 공동 편집 참여
      x-user-stories: [ARCH-11]
      description: |
        받은 초대를 수락하고 공동 편집자가 됩니다.
        수락한 뒤부터 편집 오퍼레이션을 호출할 수 있습니다.

        > **초대 거절 스토리가 없습니다.**
        > 유저 스토리에 수락(ARCH-11)만 있고 거절이 없어 거절 오퍼레이션을 만들지 않았습니다.
        > 거절이 필요하면 스토리를 먼저 추가해야 합니다.
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      responses:
        '200':
          description: 참여 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collaborator' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_COLLABORATOR` — 초대받은 적이 없음
            `COLLABORATION_CLOSED` — 수락 전에 공동 편집이 종료됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ALREADY_COLLABORATOR` — 이미 수락한 초대
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/collaborators/me:
    delete:
      tags: [공동 편집]
      operationId: leaveCollaboration
      summary: 공동 편집 나가기
      x-user-stories: [ARCH-13]
      description: |
        참여 중인 아카이브에서 스스로 빠집니다.
        참여 상태가 `LEFT`가 되고 내 아카이브 목록에서 사라지며 편집 권한을 잃습니다.

        **소유자는 나갈 수 없습니다.** 소유자가 그만두려면 공동 편집을 종료하거나(ARCH-14)
        아카이브를 삭제해야 합니다(ARCH-09).

        내가 만든 부분은 아카이브에 남습니다. 내 기록으로 보관하려면
        나가기 전에 `POST /archives/{archiveId}/duplicate`로 복제하세요(ARCH-15).
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      responses:
        '200':
          description: 나가기 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 소유자는 나갈 수 없습니다
            `NOT_COLLABORATOR` — 참여 중이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/collaboration/close:
    post:
      tags: [공동 편집]
      operationId: closeCollaboration
      summary: 공동 편집 종료
      x-user-stories: [ARCH-14]
      description: |
        공동 편집을 끝냅니다. 소유자만 할 수 있습니다.

        종료 후 참여자는 **조회는 계속 할 수 있고 편집만 막힙니다**(ADR-017).
        내용까지 남기고 싶으면 `POST /archives/{archiveId}/duplicate`로 복제합니다(ARCH-15).
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      responses:
        '200':
          description: 종료 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ArchiveDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 소유자가 아님
            `COLLABORATION_CLOSED` — 이미 종료됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/collaboration/session:
    get:
      tags: [공동 편집]
      operationId: getCollaborationSession
      summary: 실시간 편집 접속 정보 조회
      x-user-stories: [ARCH-12]
      description: |
        실시간 공동 편집에 접속할 WebSocket 주소와 구독할 토픽을 받습니다.

        > **실시간 편집 프로토콜 자체는 이 문서의 범위 밖입니다.**
        > OpenAPI는 HTTP 요청·응답만 기술합니다.
        > 어떤 메시지를 주고받는지, 두 사람이 같은 사진을 동시에 옮기면 무엇이 이기는지는
        > **별도 문서로 정의해야 합니다.** 이 오퍼레이션은 접속에 필요한 정보만 넘겨줍니다.

        **충돌 처리는 마지막 쓰기 우선입니다**(ADR-028).
        두 사람이 같은 사진을 동시에 옮기면 **나중에 도착한 변경이 이깁니다.**
        항목 단위 잠금을 두지 않으므로 편집이 막히는 일은 없고,
        드물게 남의 변경이 내 것으로 덮이는 대신 구현이 단순해집니다.

        > **[가정] 주고받을 메시지 규격은 아직 없습니다.**
        > 어떤 이벤트를 어떤 모양으로 보내는지, 재접속 시 상태를 어떻게 맞추는지가
        > 정해지지 않았습니다. **별도 문서로 정의해야 합니다.**
        > `activeEditorCount`를 실제로 표시할지도 그때 정합니다. 결정 주체: 백엔드.
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      responses:
        '200':
          description: 접속 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CollaborationSession' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` · `NOT_COLLABORATOR` — 편집 권한 없음
            `COLLABORATION_CLOSED` — 종료된 공동 편집
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ------------------------------------------------------------------
  # 커뮤니티 — 게시물
  # ------------------------------------------------------------------

  /posts:
    get:
      tags: [커뮤니티]
      operationId: listPosts
      summary: 피드 조회
      x-user-stories: [COMM-01]
      description: |
        커뮤니티 전체 피드입니다. `sort`로 인기와 최신을 고릅니다.

        **인기는 좋아요 순입니다**(ADR-019). `posts.like_count` 컬럼으로 정렬합니다.

        > **[가정] 인기 정렬에 기간 제한이 없습니다.**
        > 지금은 전체 기간 좋아요 수로 줄을 세워, 오래된 인기 게시물이 계속 위에 남습니다.
        > "최근 7일 내" 같은 조건을 넣으려면 정렬 규칙을 다시 정해야 합니다. 결정 주체: 기획.
      parameters:
        - name: sort
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PostSortType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

    post:
      tags: [커뮤니티]
      operationId: createPost
      summary: 게시물 작성
      x-user-stories: [COMM-04]
      description: |
        코스·아카이브·둘 다 중에서 공유할 대상을 고르고 게시물을 올립니다.
        **최소 하나는 지정해야 합니다** — 둘 다 없으면 `INVALID_SHARE_TARGET`입니다.

        지역은 등록 시점에 **스냅샷으로 굳힙니다**(ADR-003).
        - 코스를 공유하면 일정의 여행지와 담긴 장소들의 지역을 **자동으로 합칩니다**
        - 코스 없이 아카이브만 공유하면 `regionCodes`를 **직접 보내야** 합니다

        스냅샷이라 나중에 원본 코스를 고쳐도 이 게시물의 지역 피드 노출은 바뀌지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCreateRequest' }
      responses:
        '200':
          description: 등록 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PostDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_SHARE_TARGET` — 코스와 아카이브를 모두 지정하지 않음
            `REGION_REQUIRED` — 코스 없이 아카이브만 공유하면서 지역을 고르지 않음
            `INVALID_REQUEST` — 본문 길이 위반 등
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 남의 코스나 아카이브를 공유하려 함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND` · `ARCHIVE_NOT_FOUND` · `REGION_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /regions/{regionCode}/posts:
    get:
      tags: [커뮤니티]
      operationId: listRegionPosts
      summary: 지역별 피드 조회
      x-user-stories: [COMM-02]
      description: |
        해당 지역이 **코스에 포함되었거나 게시물에 직접 지정된** 게시물을 모두 반환합니다.
        한 여행이 여러 지역을 지나면 그 지역 피드마다 전부 노출됩니다.
        경유만 한 지역도 걸러내지 않습니다.

        판정은 `post_regions` 스냅샷으로 합니다 —
        원본 코스가 삭제된 게시물도 이 피드에서 사라지지 않습니다(ADR-003).
      parameters:
        - $ref: '#/components/parameters/RegionCode'
        - name: sort
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PostSortType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '404':
          description: |
            `REGION_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /posts/{postId}:
    get:
      tags: [커뮤니티]
      operationId: getPost
      summary: 게시물 상세 조회
      x-user-stories: [COMM-03, COMM-17]
      description: |
        공유된 코스와 아카이브, 작성자 정보를 반환합니다.
        여기서 코스 가져오기(PLAN-12)와 아카이브 가져오기(ARCH-16)로 이어집니다.

        **원본이 삭제된 게시물도 `200`입니다**(COMM-17).
        게시물 자체는 남고 `sharedCourse`·`sharedArchive`만 `null`이 되며,
        `deletedShare`가 무엇이 사라졌는지 알려줍니다.

        댓글은 여기 담지 않습니다. 댓글이 많은 글에서 응답이 무거워지므로
        `GET /posts/{postId}/comments`로 나눠 받습니다.
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PostDetail' }
                  meta: { type: 'null' }
        '404':
          description: |
            `POST_NOT_FOUND` — 게시물 자체가 삭제됨. 공유된 원본만 삭제된 경우는 `200`입니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    patch:
      tags: [커뮤니티]
      operationId: updatePost
      summary: 게시물 수정
      x-user-stories: [COMM-05]
      description: |
        게시물 본문을 고칩니다.

        > **[가정] 공유 대상과 지역은 바꿀 수 없게 두었습니다.**
        > COMM-05는 "내용을 변경한다"로만 되어 있습니다.
        > 공유 대상을 바꾸면 사실상 다른 게시물이 되고,
        > 지역 스냅샷(ADR-003)도 다시 계산해야 해서 이미 달린 댓글의 맥락이 깨집니다.
        > 바꿀 수 있어야 한다면 지역 재계산 규칙을 함께 정해야 합니다. 결정 주체: 기획.
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PostDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [커뮤니티]
      operationId: deletePost
      summary: 게시물 삭제
      x-user-stories: [COMM-06]
      description: |
        게시물을 삭제합니다. 행을 지우지 않고 `status`를 `DELETED`로 바꿉니다(ADR-007).
        공유했던 코스와 아카이브는 **삭제되지 않습니다** — 공유를 거둘 뿐입니다.
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /posts/{postId}/like:
    post:
      tags: [커뮤니티]
      operationId: likePost
      summary: 게시물 좋아요
      x-user-stories: [COMM-07]
      description: |
        좋아요를 누릅니다. 게시물의 좋아요 수가 늘고 내 좋아요 목록에 추가됩니다.
        중복은 `(post_id, user_id)` 복합키가 DB에서 막습니다(ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 좋아요 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LikeResult' }
                  meta: { type: 'null' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ALREADY_LIKED` — 이미 좋아요한 게시물
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [커뮤니티]
      operationId: unlikePost
      summary: 게시물 좋아요 취소
      x-user-stories: [COMM-19]
      description: 좋아요를 취소합니다. 좋아요 수가 줄고 내 좋아요 목록에서 빠집니다.
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 취소 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LikeResult' }
                  meta: { type: 'null' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `NOT_LIKED` — 좋아요하지 않은 게시물
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/likes:
    get:
      tags: [커뮤니티]
      operationId: listMyLikedPosts
      summary: 좋아요 목록 조회
      x-user-stories: [COMM-08]
      description: |
        내가 좋아요한 게시물을 최근에 누른 순서로 반환합니다.
        번호 방식 페이지네이션입니다(ADR-011).

        좋아요한 뒤 삭제된 게시물은 목록에서 빠집니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /users/me/posts:
    get:
      tags: [커뮤니티]
      operationId: listMyPosts
      summary: 내 게시물 목록 조회
      x-user-stories: [COMM-09]
      description: |
        내가 작성한 게시물을 최신순으로 반환합니다.
        삭제한 게시물은 포함하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  # ------------------------------------------------------------------
  # 댓글 · 대댓글
  # ------------------------------------------------------------------

  /posts/{postId}/comments:
    get:
      tags: [댓글]
      operationId: listComments
      summary: 댓글 목록 조회
      x-user-stories: [COMM-03]
      description: |
        게시물의 댓글을 작성 순서대로 반환합니다.
        각 댓글에는 대댓글 개수와 **앞의 몇 개만** 함께 담기며,
        나머지는 `GET /comments/{commentId}/replies`로 더 받습니다.

        **COMM-03에서 갈라져 나온 오퍼레이션입니다.**
        스토리는 "댓글을 확인할 수 있다"로 게시물 상세에 포함되어 있지만,
        댓글이 수백 개인 글에서 상세 응답에 전부 담으면 화면이 열리지 않습니다.
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      tags: [댓글]
      operationId: createComment
      summary: 댓글 작성
      x-user-stories: [COMM-11]
      description: 게시물에 댓글을 답니다. 대댓글은 `POST /comments/{commentId}/replies`입니다.
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentWriteRequest' }
      responses:
        '200':
          description: 등록 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Comment' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /comments/{commentId}:
    patch:
      tags: [댓글]
      operationId: updateComment
      summary: 댓글 수정
      x-user-stories: [COMM-12]
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentWriteRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Comment' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [댓글]
      operationId: deleteComment
      summary: 댓글 삭제
      x-user-stories: [COMM-13]
      description: |
        댓글을 삭제합니다. 행을 지우지 않고 `status`를 `DELETED`로 바꿉니다(ADR-007).

        **대댓글이 달린 댓글은 자리를 남깁니다.** 물리 삭제하면 남이 쓴 대댓글까지 사라집니다.
        내용은 `null`이 되고 앱은 "삭제된 댓글입니다"로 표시합니다.
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /comments/{commentId}/replies:
    get:
      tags: [댓글]
      operationId: listReplies
      summary: 대댓글 목록 조회
      x-user-stories: [COMM-03]
      description: |
        댓글에 달린 대댓글을 작성 순서대로 반환합니다.
        댓글 목록에는 앞의 몇 개만 담기므로, "답글 더 보기"에서 이 오퍼레이션을 씁니다.
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Reply' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      tags: [댓글]
      operationId: createReply
      summary: 대댓글 작성
      x-user-stories: [COMM-14]
      description: |
        댓글에 답글을 답니다. **깊이는 1단계까지입니다** —
        대댓글에 또 대댓글을 달 수는 없습니다.
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentWriteRequest' }
      responses:
        '200':
          description: 등록 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Reply' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 본문 길이 위반, 또는 대댓글에 대댓글을 달려 함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /replies/{replyId}:
    patch:
      tags: [댓글]
      operationId: updateReply
      summary: 대댓글 수정
      x-user-stories: [COMM-15]
      parameters:
        - $ref: '#/components/parameters/ReplyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentWriteRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Reply' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [댓글]
      operationId: deleteReply
      summary: 대댓글 삭제
      x-user-stories: [COMM-16]
      description: |
        대댓글을 삭제합니다. 아래에 달린 것이 없으므로 상태만 `DELETED`로 바꾸고
        목록에서 감춥니다. 댓글과 달리 자리를 남기지 않습니다.
      parameters:
        - $ref: '#/components/parameters/ReplyId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ------------------------------------------------------------------
  # 신고
  # ------------------------------------------------------------------

  /posts/{postId}/reports:
    post:
      tags: [신고]
      operationId: reportPost
      summary: 게시물 신고
      x-user-stories: [COMM-10]
      description: |
        부적절한 게시물을 운영자에게 알립니다.
        접수만 되고 즉시 조치되지 않습니다 — 관리자가 검토해 유효로 판정해야
        작성자의 누적 신고 횟수에 반영됩니다(ADMIN-09).

        같은 대상을 반복 신고할 수 없습니다. `(신고자, 대상)` 유니크가 DB에서 막습니다(ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '200':
          description: 신고 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReportResult' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ALREADY_REPORTED` — 이미 신고한 게시물
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /comments/{commentId}/reports:
    post:
      tags: [신고]
      operationId: reportComment
      summary: 댓글 신고
      x-user-stories: [COMM-18]
      description: 부적절한 댓글을 신고합니다. 대댓글은 `POST /replies/{replyId}/reports`입니다.
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '200':
          description: 신고 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReportResult' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ALREADY_REPORTED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /replies/{replyId}/reports:
    post:
      tags: [신고]
      operationId: reportReply
      summary: 대댓글 신고
      x-user-stories: [COMM-18]
      description: |
        부적절한 대댓글을 신고합니다.
        저장은 댓글 신고와 같은 테이블(`reports`)에 `target_type = COMMENT`로 들어갑니다.
        경로를 나눈 것은 관리자 삭제(ADMIN-07·ADMIN-08)가 댓글과 대댓글로 나뉘어 있어
        문서에서 짝을 맞추기 위해서입니다.
      parameters:
        - $ref: '#/components/parameters/ReplyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '200':
          description: 신고 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReportResult' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ALREADY_REPORTED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ------------------------------------------------------------------
  # 커뮤니티 — 작성자 프로필
  # ------------------------------------------------------------------

  /users/search:
    get:
      tags: [커뮤니티]
      operationId: searchUsers
      summary: 닉네임으로 사용자 검색
      x-user-stories: [ARCH-10]
      description: |
        공동 편집자로 초대할 사람을 닉네임으로 찾습니다(ADR-024).
        찾은 사용자의 `userId`를 `POST /archives/{archiveId}/collaborators`에 넘깁니다.

        **정확히 일치하는 닉네임만 반환합니다.** 부분 일치로 훑게 하면
        닉네임 목록을 긁어 모으는 통로가 됩니다.
        닉네임은 유일하므로(ADR-025) 결과는 **0개 아니면 1개**입니다.

        탈퇴하거나 차단된 회원은 결과에 나오지 않습니다.
      parameters:
        - name: nickname
          in: query
          required: true
          description: 정확히 일치하는 닉네임
          schema: { type: string, minLength: 1, maxLength: 20 }
      responses:
        '200':
          description: |
            검색 성공. 일치하는 사용자가 없으면 빈 배열입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicProfile' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — `nickname`이 비어 있음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{userId}:
    get:
      tags: [커뮤니티]
      operationId: getUserProfile
      summary: 작성자 프로필 조회
      x-user-stories: [COMM-20]
      description: |
        다른 사용자의 공개 프로필을 봅니다. 게시물에서 작성자를 눌렀을 때 들어옵니다.
        내 프로필은 `GET /users/me`이며, 그쪽에만 기록 현황과 온보딩 상태가 담깁니다.

        탈퇴하거나 차단된 회원은 `USER_NOT_FOUND`입니다 — 존재 여부를 알리지 않습니다.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicProfile' }
                  meta: { type: 'null' }
        '404':
          description: |
            `USER_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{userId}/posts:
    get:
      tags: [커뮤니티]
      operationId: listUserPosts
      summary: 작성자의 게시물 목록 조회
      x-user-stories: [COMM-20]
      description: |
        그 사용자가 커뮤니티에 올린 게시물을 최신순으로 반환합니다.
        삭제된 게시물은 포함하지 않습니다.

        COMM-20의 결과가 "닉네임과 공개된 게시물 목록을 확인할 수 있다"인데,
        목록은 페이지를 나눠야 해서 프로필 조회와 오퍼레이션을 분리했습니다.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '404':
          description: |
            `USER_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/collaborators/me/decline:
    post:
      tags: [공동 편집]
      operationId: declineCollaboration
      summary: 공동 편집 초대 거절
      x-user-stories: [ARCH-18]
      description: |
        받은 초대를 거절합니다. 초대가 사라지고 공동 편집자로 추가되지 않습니다.
        같은 아카이브에 다시 초대받는 것은 가능합니다.
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      responses:
        '200':
          description: 거절 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_COLLABORATOR` — 초대받은 적이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ALREADY_COLLABORATOR` — 이미 수락한 초대는 거절할 수 없습니다. 나가기(ARCH-13)를 쓰세요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ------------------------------------------------------------------
  # 알림
  # ------------------------------------------------------------------

  /notifications:
    get:
      tags: [알림]
      operationId: listNotifications
      summary: 알림 목록 조회
      x-user-stories: [NOTI-01, NOTI-02, NOTI-05]
      description: |
        받은 알림을 최신순으로 반환합니다. 번호 방식 페이지네이션입니다(ADR-011).

        **공동 편집 초대 알림(NOTI-02)과 경고 알림(NOTI-05)은 별도 오퍼레이션이 아니라
        이 목록의 `type` 값입니다.** 알림 종류마다 조회를 나눌 이유가 없습니다.

        | `type` | 근거 | 눌렀을 때 |
        |---|---|---|
        | `COLLAB_INVITE` | NOTI-02 | 해당 아카이브 초대 화면 |
        | `CAPSULE_UNLOCK` | TC-04 | 해당 타임캡슐 |
        | `WARNING` | NOTI-05 | 경고 사유 안내 |

        **차단은 알림으로 오지 않습니다.** 차단된 사용자는 로그인 자체가 막혀
        알림 목록에 도달할 수 없어, `POST /auth/social/{provider}`의
        `403 USER_BLOCKED` 응답으로 안내합니다(AUTH-06).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /notifications/unread-count:
    get:
      tags: [알림]
      operationId: getUnreadNotificationCount
      summary: 안 읽은 알림 개수 확인
      x-user-stories: [NOTI-06]
      description: |
        앱 진입 시 배지에 띄울 숫자만 받습니다.
        알림 목록을 열지 않아도 새 알림이 있는지 알 수 있게 목록 조회와 분리했습니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [unreadCount]
                    properties:
                      unreadCount: { type: integer, minimum: 0 }
                  meta: { type: 'null' }

  /notifications/read-all:
    post:
      tags: [알림]
      operationId: markAllNotificationsRead
      summary: 알림 모두 읽음 처리
      x-user-stories: [NOTI-04]
      description: 안 읽은 알림을 한 번에 모두 읽음으로 바꿉니다. 처리 후 개수는 `0`이 됩니다.
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [unreadCount]
                    properties:
                      unreadCount: { type: integer, enum: [0] }
                  meta: { type: 'null' }

  /notifications/{notificationId}/read:
    patch:
      tags: [알림]
      operationId: markNotificationRead
      summary: 알림 읽음 처리
      x-user-stories: [NOTI-04]
      description: |
        알림 하나를 읽음으로 바꿉니다. 이미 읽은 알림에 다시 호출해도 `200`입니다 —
        같은 결과로 수렴하는 요청이라 `409`로 막지 않습니다.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 남의 알림
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `NOTIFICATION_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /notifications/settings:
    get:
      tags: [알림]
      operationId: getNotificationSettings
      summary: 알림 설정 조회
      x-user-stories: [NOTI-03]
      description: |
        알림 종류별 수신 여부를 반환합니다.
        각 항목의 `editable`이 `false`면 사용자가 끌 수 없는 알림입니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationSetting' }
                  meta: { type: 'null' }

    patch:
      tags: [알림]
      operationId: updateNotificationSettings
      summary: 알림 설정 변경
      x-user-stories: [NOTI-03]
      description: |
        받고 싶은 알림만 켭니다. 보내지 않은 항목은 그대로 둡니다.

        **경고 알림(`WARNING`)은 끌 수 없습니다.** 운영 통지라 수신 거부 대상이 아니며,
        끄면 경고를 못 보고 차단당합니다. 끄려고 시도하면 `INVALID_REQUEST`입니다.

        > **[가정] 설정 항목의 범위가 정해지지 않았습니다.**
        > NOTI-03은 "항목을 변경한다"로만 되어 있습니다.
        > 이 문서는 알림 종류와 설정 항목을 1:1로 두었습니다.
        > "야간 수신 안 함" 같은 축이 필요하면 구조가 달라집니다. 결정 주체: 기획.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, enabled]
                    properties:
                      type: { $ref: '#/components/schemas/NotificationType' }
                      enabled: { type: boolean }
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationSetting' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 끌 수 없는 알림을 끄려 함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ------------------------------------------------------------------
  # 관리자
  # ------------------------------------------------------------------

  /admin/auth/login:
    post:
      tags: [관리자]
      operationId: adminLogin
      summary: 관리자 로그인
      x-user-stories: [ADMIN-01]
      security: []
      description: |
        관리자 전용 계정으로 인증합니다.
        일반 회원은 소셜 로그인만 쓰므로(ADR-010) 관리자 계정은 별도 저장소(`admins`)를 씁니다.

        아이디와 비밀번호 중 무엇이 틀렸는지 구분해서 알리지 않습니다.

        > **[가정] 관리자 인증 체계가 확정되지 않았습니다.**
        > 이 문서는 일반 사용자와 같은 Bearer 스킴에 역할 클레임으로 구분한다고 가정했습니다.
        > 별도 세션으로 가면 이 응답과 `securitySchemes`가 바뀝니다. 결정 주체: 백엔드.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminSession' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 아이디나 비밀번호가 비어 있음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: |
            `ADMIN_CREDENTIALS_INVALID` — 아이디 또는 비밀번호 불일치
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/auth/logout:
    post:
      tags: [관리자]
      operationId: adminLogout
      summary: 관리자 로그아웃
      x-user-stories: [ADMIN-02]
      description: 관리자 세션을 끝냅니다. 발급된 토큰을 폐기합니다.
      responses:
        '200':
          description: 로그아웃 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `ADMIN_ONLY` — 관리자가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/dashboard:
    get:
      tags: [관리자]
      operationId: getAdminDashboard
      summary: 관리자 대시보드 조회
      x-user-stories: [ADMIN-03]
      description: |
        운영 현황 숫자만 반환합니다. 회원 목록과 신고 목록은 각각 별도 오퍼레이션입니다.

        > **[가정] 어떤 지표를 보여줄지 정해지지 않았습니다.**
        > ADMIN-03이 "서비스 현황"이라고만 되어 있어, 이 문서는
        > 운영에 바로 필요한 네 가지(전체 회원 수, 오늘 가입, 미처리 신고, 제재 중 회원)만 넣었습니다.
        > 결정 주체: 기획.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminDashboard' }
                  meta: { type: 'null' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users:
    get:
      tags: [관리자]
      operationId: listAdminUsers
      summary: 회원 목록 조회
      x-user-stories: [ADMIN-12]
      description: |
        회원을 상태와 누적 신고 횟수와 함께 반환합니다.
        닉네임으로 검색하거나 상태로 걸러낼 수 있습니다.
        번호 방식 페이지네이션입니다(ADR-011).
      parameters:
        - name: keyword
          in: query
          required: false
          description: 닉네임 부분 일치
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UserStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users/{userId}:
    get:
      tags: [관리자]
      operationId: getAdminUserDetail
      summary: 회원 상세 조회
      x-user-stories: [ADMIN-13]
      description: |
        제재 전에 확인할 회원 이력입니다.
        가입 정보, 누적 유효 신고 횟수, 지금까지의 경고·차단 이력이 담깁니다.

        **차단 해제(ADMIN-11) 전에 왜 차단됐는지 확인하는 화면이기도 합니다.**
        탈퇴한 회원도 조회됩니다 — 운영 이력은 남겨야 합니다.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminUserDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `USER_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users/{userId}/warnings:
    post:
      tags: [관리자]
      operationId: warnUser
      summary: 회원 경고
      x-user-stories: [ADMIN-04]
      description: |
        누적 기준과 별개로 관리자가 즉시 경고를 내립니다.
        `sanctions`에 `source = MANUAL`로 기록되고 회원에게 알림이 갑니다(NOTI-05).

        누적 유효 신고로 자동 발생하는 경고는 이 오퍼레이션이 아니라
        신고 판정(ADMIN-09)의 결과로 처리됩니다(ADMIN-10).
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        '200':
          description: 경고 처리 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sanction' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `USER_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users/{userId}/blocks:
    post:
      tags: [관리자]
      operationId: blockUser
      summary: 회원 차단
      x-user-stories: [ADMIN-05]
      description: |
        회원의 서비스 이용을 막습니다. `users.status`가 `BLOCKED`이 되고
        발급된 토큰이 폐기됩니다.

        차단된 회원은 로그인 시 `403 USER_BLOCKED`와 함께 사유를 안내받습니다(AUTH-06).
        알림으로는 전달할 수 없습니다 — 앱에 들어올 수 없으니까요.

        > **[가정] 차단에 기간이 없습니다.**
        > ADMIN-05에 기간 언급이 없어 무기한 차단으로 두었고,
        > 푸는 것은 관리자가 직접 해제하는 방법뿐입니다(ADMIN-11).
        > 기간제 차단을 도입하면 만료 시각 컬럼과 자동 해제 배치가 필요합니다. 결정 주체: 기획.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        '200':
          description: 차단 처리 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sanction' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `USER_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `DUPLICATE_REQUEST` — 이미 차단된 회원
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [관리자]
      operationId: unblockUser
      summary: 회원 차단 해제
      x-user-stories: [ADMIN-11]
      description: |
        차단을 풀어 서비스를 다시 이용할 수 있게 합니다.
        해제 사유도 `sanctions`에 이력으로 남깁니다 — 누가 왜 풀었는지 추적할 수 있어야 합니다.

        **차단되지 않은 회원에게 호출해도 `200`입니다.** 결과가 같은 곳으로 수렴하는 요청이라
        오류로 막지 않습니다.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        '200':
          description: 해제 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminUserDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `USER_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/reports:
    get:
      tags: [관리자]
      operationId: listAdminReports
      summary: 신고 목록 조회
      x-user-stories: [ADMIN-14]
      description: |
        접수된 신고를 반환합니다. 기본은 미처리(`PENDING`) 먼저, 접수 순서대로입니다.
        `status`로 처리된 것만 따로 볼 수 있습니다.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminReportSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/reports/{reportId}:
    get:
      tags: [관리자]
      operationId: getAdminReportDetail
      summary: 신고 상세 조회
      x-user-stories: [ADMIN-15]
      description: |
        신고 사유와 **신고당한 게시물·댓글의 실제 내용**, 작성자를 함께 반환합니다.
        내용을 보지 않고는 유효 여부를 판정할 수 없어 판정(ADMIN-09) 직전에 거치는 화면입니다.

        신고 대상이 이미 삭제되었으면 `targetContent`가 `null`이고
        `targetDeleted`가 `true`입니다 — 그래도 판정은 할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminReportDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `REPORT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    patch:
      tags: [관리자]
      operationId: reviewReport
      summary: 신고 검토 및 유효 판정
      x-user-stories: [ADMIN-09, ADMIN-10]
      description: |
        신고를 유효(`VALID`) 또는 반려(`REJECTED`)로 판정합니다.

        **유효로 판정하면 자동 제재가 이어서 일어납니다(ADMIN-10).**
        신고당한 회원의 누적 유효 신고 횟수가 1 늘고, 그 값이 기준에 닿으면
        시스템이 제재를 겁니다 — **1회면 경고, 3회면 차단.**
        관리자가 따로 누르지 않습니다. 응답의 `appliedSanction`으로 무엇이 일어났는지 확인합니다.

        ADMIN-10은 이 오퍼레이션의 결과라 별도 엔드포인트가 없습니다.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [VALID, REJECTED] }
                note: { type: [string, 'null'], maxLength: 200, description: 판정 메모 }
      responses:
        '200':
          description: 판정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReportReviewResult' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — `status`가 `VALID`·`REJECTED`가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `REPORT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `REPORT_ALREADY_REVIEWED` — 이미 판정된 신고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/posts/{postId}:
    delete:
      tags: [관리자]
      operationId: adminDeletePost
      summary: 게시물 삭제
      x-user-stories: [ADMIN-06]
      description: |
        정책에 반하는 게시물을 운영자 권한으로 내립니다. 사유를 반드시 남깁니다.
        작성자 본인의 삭제(COMM-06)와 달리 **누가 왜 지웠는지가 기록됩니다.**
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '400':
          description: |
            `INVALID_REQUEST` — 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `POST_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/comments/{commentId}:
    delete:
      tags: [관리자]
      operationId: adminDeleteComment
      summary: 댓글 삭제
      x-user-stories: [ADMIN-07]
      description: |
        정책에 반하는 댓글을 내립니다. 대댓글이 달려 있으면 자리는 남깁니다(ADR-007).
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '400':
          description: |
            `INVALID_REQUEST` — 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/replies/{replyId}:
    delete:
      tags: [관리자]
      operationId: adminDeleteReply
      summary: 대댓글 삭제
      x-user-stories: [ADMIN-08]
      description: 정책에 반하는 대댓글을 내립니다. 저장은 댓글과 같은 테이블입니다.
      parameters:
        - $ref: '#/components/parameters/ReplyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRequest' }
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '400':
          description: |
            `INVALID_REQUEST` — 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ADMIN_ONLY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `COMMENT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        서버가 발급한 액세스 토큰. 만료 30분.
        관리자도 같은 스킴을 쓰되 역할 클레임으로 구분합니다([가정], 결정 주체: 백엔드).

  parameters:

    Provider:
      name: provider
      in: path
      required: true
      description: 소셜 로그인 제공자
      schema:
        type: string
        enum: [google, kakao, naver]

    Page:
      name: page
      in: query
      required: false
      description: 1부터 시작하는 페이지 번호
      schema: { type: integer, minimum: 1, default: 1 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 `meta.nextCursor`. 첫 페이지에서는 생략합니다
      schema: { type: string }

    Size:
      name: size
      in: query
      required: false
      description: 한 번에 받을 개수
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    TripPlaceId:
      name: tripPlaceId
      in: path
      required: true
      description: 일정에 담긴 장소 한 건의 식별자. 관광지 자체의 `placeId`와 다릅니다
      schema: { type: integer, format: int64 }

    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    RegionCode:
      name: regionCode
      in: path
      required: true
      description: 콘텐츠랩 areaCode 또는 sigunguCode(ADR-004)
      schema: { type: string }

    VisitId:
      name: visitId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    CapsuleId:
      name: capsuleId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    ArchiveId:
      name: archiveId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    ArchiveItemId:
      name: itemId
      in: path
      required: true
      description: 아카이브에 배치된 항목 한 건. 사진 자체의 `mediaId`와 다릅니다
      schema: { type: integer, format: int64 }

    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    UserId:
      name: userId
      in: path
      required: true
      description: '`me`는 내 계정을 가리키는 예약어라 사용자 식별자로 쓸 수 없습니다'
      schema: { type: integer, format: int64 }

    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    ReplyId:
      name: replyId
      in: path
      required: true
      description: 대댓글도 댓글과 같은 저장소를 쓰지만 경로를 나눠 스토리를 구분합니다
      schema: { type: integer, format: int64 }

  schemas:

    # --- 공통 봉투 ---

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: '`docs/error-codes.md`에 정의된 코드'
              examples: [TRIP_NOT_FOUND]
            message:
              type: string
              description: 사용자에게 그대로 보여줄 수 있는 한국어 문장
            details:
              type: [object, 'null']
              description: 코드별 부가 정보. 검증 실패일 때만 형태가 고정됩니다
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      field: { type: string }
                      reason: { type: string }

    EmptySuccess:
      type: object
      description: 반환할 본문이 없는 성공 응답
      properties:
        data: { type: 'null' }
        meta: { type: 'null' }

    PageMeta:
      type: object
      description: 번호 방식 목록의 페이지 정보
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, examples: [1] }
        size: { type: integer, examples: [20] }
        totalElements: { type: integer, examples: [137] }
        totalPages: { type: integer, examples: [7] }

    CursorMeta:
      type: object
      description: 커서 방식 목록의 이어보기 정보
      required: [hasNext]
      properties:
        nextCursor:
          type: [string, 'null']
          description: 다음 요청의 `cursor`로 그대로 넣습니다. 클라이언트가 해석하지 않습니다
        hasNext: { type: boolean }

    # --- 인증 ---

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: 만료 30분
        refreshToken:
          type: string
          description: 만료 7일. 재발급 시 함께 교체됩니다

    AuthResult:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [isNewUser, onboardingCompleted]
          properties:
            isNewUser:
              type: boolean
              description: 이번 요청으로 회원가입이 일어났으면 `true`(AUTH-01), 기존 회원이면 `false`(AUTH-02)
            onboardingCompleted:
              type: boolean
              description: '`false`이면 앱이 초기 설정 화면으로 보냅니다'

    # --- 사용자 ---

    MyProfile:
      type: object
      required: [userId, nickname, onboardingCompleted]
      properties:
        userId: { type: integer, format: int64 }
        nickname:
          type: string
          maxLength: 20
        profileImageUrl:
          type: [string, 'null']
          format: uri
        onboardingCompleted: { type: boolean }
        stats:
          $ref: '#/components/schemas/MyStats'

    MyStats:
      type: object
      description: |
        내 기록 현황. **[가정]** — 어떤 지표를 보여줄지 미정이라 세 가지만 잠정 선정했습니다.
        결정 주체: 기획.
      properties:
        archiveCount:
          type: integer
          description: 내가 만든 아카이브 수
        tripCount:
          type: integer
          description: 내가 만든 여행 일정 수
        visitedRegionCount:
          type: integer
          description: 방문 인증을 마친 지역 수

    ProfileUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            **[가정]** 중복 허용 여부와 금칙어 정책이 미정이라 길이 제약만 두었습니다.
            결정 주체: 기획.
        profileImageUrl:
          type: [string, 'null']
          format: uri
          description: '`null`을 보내면 기본 이미지로 되돌립니다'

    # --- 여행 일정(코스) ---

    TripStatus:
      type: string
      enum: [UPCOMING, ONGOING, PAST]
      description: 오늘 날짜와 여행 기간을 비교해 서버가 계산합니다

    TripCreateRequest:
      type: object
      required: [title, startDate, endDate, regionCodes]
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        regionCodes:
          type: array
          minItems: 1
          description: 여행지. 복수 선택 가능합니다(PLAN-01)
          items: { type: string }

    TripUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        regionCodes:
          type: array
          minItems: 1
          items: { type: string }

    TripSummary:
      type: object
      required: [tripId, title, startDate, endDate, status, regions, placeCount]
      properties:
        tripId: { type: integer, format: int64 }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/TripStatus' }
        regions:
          type: array
          items: { $ref: '#/components/schemas/RegionSummary' }
        placeCount:
          type: integer
          description: 담긴 장소 수
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: 담긴 장소 중 첫 번째의 대표 이미지
        linkedArchiveId:
          type: [integer, 'null']
          format: int64
          description: 연결된 아카이브. 없으면 `null`(ADR-001)

    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          required: [days]
          properties:
            days:
              type: array
              description: 여행 기간만큼의 일자가 장소가 없어도 모두 들어갑니다
              items: { $ref: '#/components/schemas/TripDay' }
            originTripId:
              type: [integer, 'null']
              format: int64
              description: 남의 코스를 가져와 만든 일정이면 원본 식별자(ADR-005)

    TripDay:
      type: object
      required: [dayNumber, date, places]
      properties:
        dayNumber: { type: integer, minimum: 1, description: '여행 1일차 = 1' }
        date: { type: string, format: date }
        places:
          type: array
          description: '`sortOrder` 오름차순으로 정렬되어 있습니다'
          items: { $ref: '#/components/schemas/TripPlace' }

    TripPlace:
      type: object
      required: [tripPlaceId, place, dayNumber, sortOrder]
      properties:
        tripPlaceId:
          type: integer
          format: int64
          description: 일정에 담긴 이 한 건의 식별자. 같은 장소를 다른 날 또 담으면 다른 값입니다
        place: { $ref: '#/components/schemas/PlaceSummary' }
        dayNumber: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 1, description: 그 날의 방문 순서 }
        memo: { type: [string, 'null'] }

    TripPlaceCreateRequest:
      type: object
      required: [placeId, dayNumber]
      properties:
        placeId: { type: integer, format: int64 }
        dayNumber: { type: integer, minimum: 1 }
        sortOrder:
          type: [integer, 'null']
          minimum: 1
          description: 생략하면 해당 일자의 맨 뒤에 붙습니다
        memo: { type: [string, 'null'], maxLength: 500 }

    TripPlaceUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        dayNumber: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 1 }
        memo: { type: [string, 'null'], maxLength: 500 }

    TripPlaceOrderRequest:
      type: object
      required: [items]
      description: 일정에 담긴 **모든** 장소를 보내야 합니다. 부분 전송은 거부됩니다
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [tripPlaceId, dayNumber, sortOrder]
            properties:
              tripPlaceId: { type: integer, format: int64 }
              dayNumber: { type: integer, minimum: 1 }
              sortOrder: { type: integer, minimum: 1 }

    AutoArrangeRequest:
      type: object
      description: |
        본문 없이 호출하면 일정에 이미 담긴 장소만 재배치합니다.
        **[가정]** 이 입력 형태는 확정되지 않았습니다 — `POST /trips/{tripId}/auto-arrange` 설명 참고.
      properties:
        additionalPlaceIds:
          type: array
          description: 재배치와 함께 새로 담을 장소들
          items: { type: integer, format: int64 }

    TripRoute:
      type: object
      required: [tripId, days]
      properties:
        tripId: { type: integer, format: int64 }
        days:
          type: array
          items:
            type: object
            required: [dayNumber, points]
            properties:
              dayNumber: { type: integer, minimum: 1 }
              points:
                type: array
                description: 방문 순서대로 정렬된 좌표
                items:
                  type: object
                  required: [sortOrder, lat, lng, title]
                  properties:
                    sortOrder: { type: integer, minimum: 1 }
                    tripPlaceId: { type: integer, format: int64 }
                    lat: { type: number, format: double }
                    lng: { type: number, format: double }
                    title: { type: string }
              totalDistanceMeters:
                type: [integer, 'null']
                description: |
                  그 날 이동 거리의 합. **[가정]** 직선 거리 기준입니다.
                  실제 도로 거리가 필요하면 외부 경로 API를 붙여야 합니다
        boundingBox:
          type: object
          description: 지도를 이 범위에 맞추면 동선 전체가 들어옵니다
          required: [minLat, minLng, maxLat, maxLng]
          properties:
            minLat: { type: number, format: double }
            minLng: { type: number, format: double }
            maxLat: { type: number, format: double }
            maxLng: { type: number, format: double }

    # --- 지역 · 장소 ---

    RegionSummary:
      type: object
      required: [code, name, level]
      properties:
        code:
          type: string
          description: 콘텐츠랩 areaCode / sigunguCode 원본(ADR-004)
        name: { type: string }
        level: { type: string, enum: [SIDO, SIGUNGU] }

    PlaceSummary:
      type: object
      required: [placeId, title, lat, lng, region]
      properties:
        placeId: { type: integer, format: int64 }
        contentId:
          type: string
          description: 콘텐츠랩 contentid
        contentTypeId:
          type: [string, 'null']
          description: 관광지·음식점·숙박 등 분류 코드
        title: { type: string }
        thumbnailUrl: { type: [string, 'null'], format: uri }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        region: { $ref: '#/components/schemas/RegionSummary' }

    PlaceDetail:
      allOf:
        - $ref: '#/components/schemas/PlaceSummary'
        - type: object
          properties:
            addr: { type: [string, 'null'] }
            tel: { type: [string, 'null'] }
            overview:
              type: [string, 'null']
              description: 콘텐츠랩 소개글
            imageUrls:
              type: array
              description: 관광 사진 정보에서 받은 공공저작물 이미지
              items: { type: string, format: uri }

    # --- 지도 · 방문 인증 ---

    RegionVisitRequest:
      type: object
      required: [lat, lng, accuracyMeters]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracyMeters:
          type: number
          description: |
            단말이 좌표와 함께 알려주는 정확도(iOS `horizontalAccuracy`, Android `getAccuracy()`).
            100m를 넘으면 거절합니다(ADR-016)
        regionCode:
          type: [string, 'null']
          description: |
            앱이 판단한 현재 지역. 보내면 서버 판정 결과와 대조하고,
            다르면 `LOCATION_MISMATCH`로 거절합니다. 생략하면 서버 판정을 그대로 씁니다

    RewardStatus:
      type: string
      enum: [UNLOCKED, GROWN, COOLDOWN, NONE]
      description: |
        `UNLOCKED` 처음 방문해 오브젝트 해금 · `GROWN` 기존 오브젝트가 성장 ·
        `COOLDOWN` 7일 안에 재인증이라 변화 없음 · `NONE` 그 지역에 지정된 오브젝트가 없음

    RegionVisitResult:
      type: object
      required: [visitId, region, verifiedAt, isFirstVisit, rewardStatus]
      properties:
        visitId: { type: integer, format: int64 }
        region: { $ref: '#/components/schemas/RegionSummary' }
        verifiedAt: { type: string, format: date-time }
        isFirstVisit: { type: boolean }
        rewardStatus: { $ref: '#/components/schemas/RewardStatus' }
        reward:
          oneOf:
            - $ref: '#/components/schemas/VisitReward'
            - type: 'null'
          description: 보상 상세. `rewardStatus`가 `NONE`이면 `null`

    RegionVisitStatus:
      type: object
      required: [region, visited]
      properties:
        region: { $ref: '#/components/schemas/RegionSummary' }
        visited: { type: boolean }
        visitCount: { type: integer, description: 인증 횟수 }
        lastVisitedAt: { type: [string, 'null'], format: date-time }

    RegionDetail:
      allOf:
        - $ref: '#/components/schemas/RegionSummary'
        - type: object
          properties:
            centerLat: { type: number, format: double }
            centerLng: { type: number, format: double }
            visited: { type: boolean }
            visitCount: { type: integer }
            availableGardenObjects:
              type: array
              description: 이 지역에서 얻을 수 있는 식물·오브젝트
              items: { $ref: '#/components/schemas/GardenObject' }

    # --- 정원 ---

    GardenObjectType:
      type: string
      enum: [PLANT, OBJECT]

    GardenObject:
      type: object
      description: 도감 정보. 사용자가 가졌는지와 무관한 마스터 데이터입니다
      required: [gardenObjectId, name, type, maxStage]
      properties:
        gardenObjectId: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/GardenObjectType' }
        imageUrl: { type: [string, 'null'], format: uri }
        maxStage: { type: integer, minimum: 1, description: 더 자랄 수 없는 단계 }
        region:
          oneOf:
            - $ref: '#/components/schemas/RegionSummary'
            - type: 'null'
          description: 지역 전용이면 해당 지역, 공통이면 `null`

    Garden:
      type: object
      required: [objects, unlockedCount, totalCount]
      properties:
        objects:
          type: array
          items: { $ref: '#/components/schemas/UserGardenObject' }
        unlockedCount: { type: integer, description: 해금한 오브젝트 수 }
        totalCount: { type: integer, description: 도감 전체 오브젝트 수 }

    UserGardenObject:
      type: object
      required: [userGardenObjectId, gardenObject, stage]
      properties:
        userGardenObjectId: { type: integer, format: int64 }
        gardenObject: { $ref: '#/components/schemas/GardenObject' }
        stage: { type: integer, minimum: 1, description: 현재 성장 단계 }
        positionX: { type: [integer, 'null'], description: 정원 안 배치 좌표 }
        positionY: { type: [integer, 'null'] }
        unlockedAt: { type: string, format: date-time }
        lastGrownAt: { type: [string, 'null'], format: date-time }

    VisitReward:
      type: object
      required: [visitId, region, rewardStatus]
      properties:
        visitId: { type: integer, format: int64 }
        region: { $ref: '#/components/schemas/RegionSummary' }
        rewardStatus: { $ref: '#/components/schemas/RewardStatus' }
        gardenObject:
          oneOf:
            - $ref: '#/components/schemas/GardenObject'
            - type: 'null'
        previousStage:
          type: [integer, 'null']
          description: 성장 전 단계. 해금이면 `null`
        currentStage: { type: [integer, 'null'] }
        nextAvailableAt:
          type: [string, 'null']
          format: date-time
          description: '`rewardStatus`가 `COOLDOWN`일 때 다음 성장 가능 시각(ADR-018)'

    # --- 미디어 ---

    MediaType:
      type: string
      enum: [IMAGE, VIDEO]

    MediaStatus:
      type: string
      enum: [PENDING, READY]
      description: |
        `PENDING` URL만 발급된 상태 · `READY` 업로드가 끝나 아카이브·타임캡슐에 담을 수 있는 상태.
        **`PENDING`인 `mediaId`는 다른 도메인에서 쓸 수 없습니다**(ADR-023)

    MediaUploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string, maxLength: 255 }
        contentType:
          type: string
          description: 'image/jpeg · image/png · image/heic · image/webp · video/mp4 · video/quicktime'
        sizeBytes: { type: integer, minimum: 1 }

    MediaUploadTicket:
      type: object
      required: [mediaId, uploadUrl, expiresAt]
      properties:
        mediaId:
          type: integer
          format: int64
          description: 업로드를 마친 뒤 `POST /media/complete`에 그대로 보냅니다
        uploadUrl:
          type: string
          format: uri
          description: 이 주소에 파일을 `PUT`으로 올립니다. 이 API가 아니라 스토리지로 직접 보냅니다
        expiresAt: { type: string, format: date-time }

    Media:
      type: object
      required: [mediaId, type, status, url]
      properties:
        mediaId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/MediaStatus' }
        type: { $ref: '#/components/schemas/MediaType' }
        url: { type: string, format: uri }
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: 영상은 첫 프레임에서 뽑습니다
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationMs:
          type: [integer, 'null']
          description: 영상만 채워집니다
        sizeBytes: { type: integer }
        takenAt:
          type: [string, 'null']
          format: date-time
          description: EXIF 촬영 시각. 없으면 `null`
        lat:
          type: [number, 'null']
          format: double
          description: EXIF 촬영 좌표. 없으면 `null`
        lng: { type: [number, 'null'], format: double }
        createdAt: { type: string, format: date-time }

    # --- 타임캡슐 ---

    TimeCapsuleStatus:
      type: string
      enum: [SEALED, UNLOCKABLE, OPENED]
      description: |
        `SEALED` 조건 미충족 · `UNLOCKABLE` 조건 충족, 아직 열지 않음 · `OPENED` 열어봄

    UnlockType:
      type: string
      enum: [DATE, LOCATION]

    UnlockCondition:
      type: object
      required: [type, satisfied]
      properties:
        type: { $ref: '#/components/schemas/UnlockType' }
        satisfied:
          type: boolean
          description: 지금 조건이 충족된 상태인지
        unlockDate:
          type: [string, 'null']
          format: date
          description: '`type`이 `DATE`일 때만 채워집니다'
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        radiusMeters:
          type: [integer, 'null']
          description: '`type`이 `LOCATION`일 때만 채워집니다'
        placeName:
          type: [string, 'null']
          description: 사용자가 알아볼 수 있게 저장해 둔 장소 이름

    TimeCapsuleCreateRequest:
      type: object
      required: [title, content, unlockType]
      description: 해제 조건은 날짜와 위치 중 **하나만** 지정합니다
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        content: { type: string, minLength: 1, maxLength: 5000 }
        unlockType: { $ref: '#/components/schemas/UnlockType' }
        unlockDate:
          type: [string, 'null']
          format: date
          description: '`unlockType`이 `DATE`일 때 필수. 오늘보다 뒤여야 합니다'
        unlockLat: { type: [number, 'null'], format: double }
        unlockLng: { type: [number, 'null'], format: double }
        unlockRadiusMeters:
          type: [integer, 'null']
          minimum: 50
          description: '`unlockType`이 `LOCATION`일 때 필수'
        placeName: { type: [string, 'null'], maxLength: 60 }
        mediaIds:
          type: array
          description: '업로드를 마쳐 `READY` 상태가 된 사진·영상의 식별자(ADR-023)'
          items: { type: integer, format: int64 }

    TimeCapsuleSummary:
      type: object
      description: 목록용. **내용을 포함하지 않습니다**
      required: [capsuleId, title, status, unlockType, createdAt]
      properties:
        capsuleId: { type: integer, format: int64 }
        title: { type: string }
        status: { $ref: '#/components/schemas/TimeCapsuleStatus' }
        unlockType: { $ref: '#/components/schemas/UnlockType' }
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: 열어본 캡슐만 채워집니다. 봉인 상태에서는 `null`
        createdAt: { type: string, format: date-time }
        openedAt: { type: [string, 'null'], format: date-time }

    TimeCapsuleDetail:
      allOf:
        - $ref: '#/components/schemas/TimeCapsuleSummary'
        - type: object
          required: [unlockCondition]
          properties:
            unlockCondition: { $ref: '#/components/schemas/UnlockCondition' }
            content:
              type: [string, 'null']
              description: '**`status`가 `OPENED`일 때만 채워집니다.** 그 전에는 `null`'
            media:
              type: array
              description: '**`status`가 `OPENED`일 때만 채워집니다.** 그 전에는 빈 배열'
              items: { $ref: '#/components/schemas/Media' }

    # --- 아카이브 ---

    ArchiveTheme:
      type: string
      enum: [BOOK, POLAROID, ALBUM, SCRAPBOOK]
      description: 책자 · 폴라로이드 · 앨범 · 스크랩북

    CollaborationStatus:
      type: string
      enum: [NONE, OPEN, CLOSED]
      description: '`NONE` 혼자 만드는 중 · `OPEN` 공동 편집 중 · `CLOSED` 종료됨(조회만 가능)'

    CollaboratorRole:
      type: string
      enum: [OWNER, EDITOR]

    CollaboratorStatus:
      type: string
      enum: [INVITED, JOINED, LEFT]

    ArchiveLayout:
      type: object
      description: 테마 캔버스 위의 배치. 좌표와 크기는 캔버스 폭을 1.0으로 본 비율입니다
      required: [x, y, width, height]
      properties:
        x: { type: number, format: double, minimum: 0, maximum: 1 }
        y: { type: number, format: double, minimum: 0, maximum: 1 }
        width: { type: number, format: double, minimum: 0, maximum: 1 }
        height: { type: number, format: double, minimum: 0, maximum: 1 }
        rotation:
          type: number
          format: double
          description: 시계 방향 각도(도). 기본 0

    ArchiveItem:
      type: object
      required: [itemId, media, sortOrder, layout]
      properties:
        itemId:
          type: integer
          format: int64
          description: 아카이브에 배치된 이 한 건의 식별자. 같은 사진을 두 번 배치하면 값이 다릅니다
        media: { $ref: '#/components/schemas/Media' }
        sortOrder: { type: integer, minimum: 1 }
        layout: { $ref: '#/components/schemas/ArchiveLayout' }
        caption:
          type: [string, 'null']
          description: 사진에 붙인 짧은 글(ADR-029)
        isCover: { type: boolean, description: 대표 사진으로 지정된 항목인지 }

    ArchiveCreateRequest:
      type: object
      required: [title, theme]
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        theme: { $ref: '#/components/schemas/ArchiveTheme' }
        primaryColor:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: 대표 색상
        tripId:
          type: [integer, 'null']
          format: int64
          description: |
            연결할 여행 일정. 생략 가능합니다(ADR-001).
            **연결해도 아카이브의 여행 기간에는 영향을 주지 않습니다**(ADR-030)

    ArchiveSummary:
      type: object
      required: [archiveId, title, theme, collaborationStatus, itemCount, myRole, createdAt]
      properties:
        archiveId: { type: integer, format: int64 }
        title: { type: string }
        theme: { $ref: '#/components/schemas/ArchiveTheme' }
        primaryColor: { type: [string, 'null'] }
        coverImageUrl:
          type: [string, 'null']
          format: uri
          description: 대표 사진(ARCH-08). 지정하지 않았으면 `null`
        startDate:
          type: [string, 'null']
          format: date
          description: |
            담긴 사진의 촬영 시각 중 가장 이른 날. **서버가 계산하며 입력받지 않습니다**(ADR-030).
            촬영 정보가 있는 사진이 하나도 없으면 `null`
        endDate:
          type: [string, 'null']
          format: date
          description: 담긴 사진의 촬영 시각 중 가장 늦은 날
        itemCount: { type: integer, description: 배치된 사진·영상 수 }
        collaborationStatus: { $ref: '#/components/schemas/CollaborationStatus' }
        myRole:
          $ref: '#/components/schemas/CollaboratorRole'
        linkedTripId:
          type: [integer, 'null']
          format: int64
          description: 연결된 여행 일정. 없으면 `null`
        createdAt: { type: string, format: date-time }

    ArchiveDetail:
      allOf:
        - $ref: '#/components/schemas/ArchiveSummary'
        - type: object
          required: [items, collaborators]
          properties:
            items:
              type: array
              description: '`sortOrder` 오름차순으로 정렬되어 있습니다'
              items: { $ref: '#/components/schemas/ArchiveItem' }
            collaborators:
              type: array
              items: { $ref: '#/components/schemas/Collaborator' }
            originArchiveId:
              type: [integer, 'null']
              format: int64
              description: 복제해서 만든 아카이브면 원본 식별자(ADR-005)

    ArchiveItemsAddRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [mediaId]
            properties:
              mediaId: { type: integer, format: int64 }
              layout:
                oneOf:
                  - $ref: '#/components/schemas/ArchiveLayout'
                  - type: 'null'
                description: 생략하면 테마의 기본 배치를 서버가 채웁니다
              caption: { type: [string, 'null'], maxLength: 300 }

    ArchiveItemUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        sortOrder: { type: integer, minimum: 1 }
        layout: { $ref: '#/components/schemas/ArchiveLayout' }
        caption: { type: [string, 'null'], maxLength: 300 }

    ArchiveLayoutRequest:
      type: object
      required: [items]
      description: 아카이브의 **모든** 항목을 보내야 합니다. 부분 전송은 거부됩니다
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, sortOrder, layout]
            properties:
              itemId: { type: integer, format: int64 }
              sortOrder: { type: integer, minimum: 1 }
              layout: { $ref: '#/components/schemas/ArchiveLayout' }

    # --- 공동 편집 ---

    Collaborator:
      type: object
      required: [userId, nickname, role, status]
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        profileImageUrl: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/CollaboratorRole' }
        status: { $ref: '#/components/schemas/CollaboratorStatus' }
        invitedAt: { type: string, format: date-time }
        joinedAt: { type: [string, 'null'], format: date-time }

    CollaborationSession:
      type: object
      description: |
        **[가정]** 메시지 규격이 정해지지 않아 이 응답 형태도 잠정입니다(ADR-028).
        결정 주체: 백엔드.
      required: [websocketUrl, topic]
      properties:
        websocketUrl:
          type: string
          format: uri
          description: 접속할 WebSocket 주소
        topic:
          type: string
          description: 이 아카이브의 변경을 받을 구독 경로
        activeEditorCount:
          type: [integer, 'null']
          description: 지금 접속 중인 인원. 표시 여부가 미정이라 `null`일 수 있습니다

    ArchiveUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        theme: { $ref: '#/components/schemas/ArchiveTheme' }
        primaryColor:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'

    # --- 커뮤니티 ---

    PostSortType:
      type: string
      enum: [POPULAR, LATEST]
      default: LATEST
      description: '`POPULAR`은 좋아요 순(ADR-019)'

    ShareType:
      type: string
      enum: [COURSE, ARCHIVE, BOTH]
      description: |
        등록 시점에 무엇을 공유했는지. **원본이 삭제된 뒤에도 남습니다.**
        코스·아카이브 FK가 `ON DELETE SET NULL`이라(ADR-002)
        이 값이 없으면 "처음부터 안 공유함"과 "공유했는데 삭제됨"을 구분할 수 없습니다

    Author:
      type: object
      required: [userId, nickname]
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        profileImageUrl: { type: [string, 'null'], format: uri }

    PostSummary:
      type: object
      required: [postId, author, content, likeCount, commentCount, regions, likedByMe, createdAt]
      properties:
        postId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content: { type: string, description: 피드에서는 앞부분만 잘라 보낼 수 있습니다 }
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: 공유한 아카이브의 대표 사진, 없으면 코스 첫 장소의 이미지
        likeCount: { type: integer }
        commentCount: { type: integer, description: 대댓글을 포함한 수 }
        likedByMe: { type: boolean }
        regions:
          type: array
          description: 등록 시점에 굳힌 지역 스냅샷(ADR-003)
          items: { $ref: '#/components/schemas/RegionSummary' }
        createdAt: { type: string, format: date-time }

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [shareType]
          properties:
            shareType: { $ref: '#/components/schemas/ShareType' }
            sharedCourse:
              oneOf:
                - $ref: '#/components/schemas/TripSummary'
                - type: 'null'
              description: 공유한 코스. 삭제되었으면 `null`
            sharedArchive:
              oneOf:
                - $ref: '#/components/schemas/ArchiveSummary'
                - type: 'null'
              description: 공유한 아카이브. 삭제되었으면 `null`
            deletedShare:
              type: array
              description: |
                `shareType`에는 있는데 원본이 사라진 것들(COMM-17).
                앱은 이 값으로 "삭제된 기록입니다"를 표시합니다
              items: { type: string, enum: [COURSE, ARCHIVE] }
            updatedAt: { type: [string, 'null'], format: date-time }

    PostCreateRequest:
      type: object
      required: [content]
      description: '`tripId`와 `archiveId` 중 최소 하나는 있어야 합니다'
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
        tripId: { type: [integer, 'null'], format: int64 }
        archiveId: { type: [integer, 'null'], format: int64 }
        regionCodes:
          type: array
          description: |
            코스를 공유하지 않을 때 **필수**입니다(COMM-04).
            코스를 공유하면 보내지 않아도 서버가 일정에서 자동으로 뽑습니다
          items: { type: string }

    LikeResult:
      type: object
      required: [postId, likeCount, likedByMe]
      properties:
        postId: { type: integer, format: int64 }
        likeCount: { type: integer }
        likedByMe: { type: boolean }

    # --- 댓글 ---

    CommentStatus:
      type: string
      enum: [ACTIVE, DELETED]

    CommentWriteRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }

    Reply:
      type: object
      required: [replyId, parentCommentId, author, status, createdAt]
      properties:
        replyId: { type: integer, format: int64 }
        parentCommentId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content:
          type: [string, 'null']
          description: 삭제된 대댓글은 `null`
        status: { $ref: '#/components/schemas/CommentStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    Comment:
      type: object
      required: [commentId, author, status, replyCount, createdAt]
      properties:
        commentId: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/Author' }
        content:
          type: [string, 'null']
          description: |
            삭제된 댓글은 `null`입니다. 대댓글이 달려 있으면 자리는 남으므로(ADR-007)
            앱은 "삭제된 댓글입니다"로 표시합니다
        status: { $ref: '#/components/schemas/CommentStatus' }
        replyCount: { type: integer }
        replies:
          type: array
          description: 앞의 몇 개만 미리 담깁니다. 나머지는 `GET /comments/{commentId}/replies`
          items: { $ref: '#/components/schemas/Reply' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    # --- 신고 ---

    ReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            **[가정]** 신고 사유를 자유 입력으로 두었습니다.
            정해진 항목에서 고르게 하려면 사유 코드 목록을 먼저 정해야 합니다. 결정 주체: 기획

    ReportResult:
      type: object
      required: [reportId, status]
      properties:
        reportId: { type: integer, format: int64 }
        status:
          type: string
          enum: [PENDING]
          description: 접수 시점에는 항상 `PENDING`입니다. 판정은 관리자가 합니다(ADMIN-09)

    # --- 공개 프로필 ---

    PublicProfile:
      type: object
      description: 다른 사용자에게 보이는 정보. 내 프로필(`MyProfile`)보다 좁습니다
      required: [userId, nickname, postCount]
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        profileImageUrl: { type: [string, 'null'], format: uri }
        postCount: { type: integer, description: 공개된 게시물 수 }

    # --- 알림 ---

    NotificationType:
      type: string
      enum: [COLLAB_INVITE, CAPSULE_UNLOCK, WARNING]
      description: |
        `COLLAB_INVITE` 공동 편집 초대(NOTI-02) · `CAPSULE_UNLOCK` 타임캡슐 해제(TC-04) ·
        `WARNING` 경고(NOTI-05). **차단은 알림으로 오지 않습니다**(AUTH-06)

    Notification:
      type: object
      required: [notificationId, type, title, isRead, createdAt]
      properties:
        notificationId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: [string, 'null'] }
        targetType:
          type: [string, 'null']
          enum: [ARCHIVE, TIME_CAPSULE, SANCTION, 'null']
          description: 눌렀을 때 이동할 대상의 종류
        targetId: { type: [integer, 'null'], format: int64 }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationSetting:
      type: object
      required: [type, enabled, editable]
      properties:
        type: { $ref: '#/components/schemas/NotificationType' }
        enabled: { type: boolean }
        editable:
          type: boolean
          description: '`false`면 사용자가 끌 수 없습니다. 경고 알림이 여기 해당합니다'

    # --- 관리자 ---

    UserStatus:
      type: string
      enum: [ACTIVE, WARNED, BLOCKED, WITHDRAWN]

    SanctionType:
      type: string
      enum: [WARNING, BLOCK, UNBLOCK]

    SanctionSource:
      type: string
      enum: [MANUAL, AUTO]
      description: '`AUTO`는 누적 유효 신고로 시스템이 건 제재(ADMIN-10)'

    SanctionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }

    Sanction:
      type: object
      required: [sanctionId, userId, type, source, reason, createdAt]
      properties:
        sanctionId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/SanctionType' }
        source: { $ref: '#/components/schemas/SanctionSource' }
        reason: { type: string }
        issuedByAdminName:
          type: [string, 'null']
          description: 자동 제재면 `null`
        createdAt: { type: string, format: date-time }

    AdminSession:
      type: object
      required: [accessToken, adminName]
      properties:
        accessToken: { type: string }
        refreshToken: { type: [string, 'null'] }
        adminName: { type: string }

    AdminDashboard:
      type: object
      description: '**[가정]** 지표 구성이 확정되지 않았습니다'
      required: [totalUserCount, newUserCountToday, pendingReportCount, sanctionedUserCount]
      properties:
        totalUserCount: { type: integer }
        newUserCountToday: { type: integer }
        pendingReportCount: { type: integer, description: 아직 판정하지 않은 신고 }
        sanctionedUserCount: { type: integer, description: 경고 또는 차단 상태인 회원 }

    AdminUserSummary:
      type: object
      required: [userId, nickname, status, validReportCount, createdAt]
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        validReportCount:
          type: integer
          description: 유효로 판정된 누적 신고 횟수. 1이면 경고, 3이면 차단(ADMIN-10)
        createdAt: { type: string, format: date-time }

    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          required: [sanctions]
          properties:
            socialProviders:
              type: array
              description: 연결된 소셜 계정 제공자
              items: { type: string, enum: [google, kakao, naver] }
            postCount: { type: integer }
            commentCount: { type: integer }
            sanctions:
              type: array
              description: 경고·차단·해제 이력. 최근 것이 앞에 옵니다
              items: { $ref: '#/components/schemas/Sanction' }
            withdrawnAt: { type: [string, 'null'], format: date-time }

    ReportStatus:
      type: string
      enum: [PENDING, VALID, REJECTED]

    AdminReportSummary:
      type: object
      required: [reportId, targetType, targetId, reason, status, reporter, createdAt]
      properties:
        reportId: { type: integer, format: int64 }
        targetType: { type: string, enum: [POST, COMMENT] }
        targetId: { type: integer, format: int64 }
        targetAuthor: { $ref: '#/components/schemas/Author' }
        reason: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        reporter: { $ref: '#/components/schemas/Author' }
        createdAt: { type: string, format: date-time }

    AdminReportDetail:
      allOf:
        - $ref: '#/components/schemas/AdminReportSummary'
        - type: object
          properties:
            targetContent:
              type: [string, 'null']
              description: 신고당한 게시물·댓글의 실제 내용. 이미 삭제되었으면 `null`
            targetDeleted:
              type: boolean
              description: 신고 대상이 이미 삭제된 상태인지
            reviewedByAdminName: { type: [string, 'null'] }
            reviewedAt: { type: [string, 'null'], format: date-time }
            note: { type: [string, 'null'] }

    ReportReviewResult:
      type: object
      required: [report, targetUserValidReportCount]
      properties:
        report: { $ref: '#/components/schemas/AdminReportDetail' }
        targetUserValidReportCount:
          type: integer
          description: 판정 후 신고당한 회원의 누적 유효 신고 횟수
        appliedSanction:
          oneOf:
            - $ref: '#/components/schemas/Sanction'
            - type: 'null'
          description: |
            누적 횟수가 기준에 닿아 시스템이 자동으로 건 제재(ADMIN-10).
            기준에 닿지 않았거나 반려 판정이면 `null`
