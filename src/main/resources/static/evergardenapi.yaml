        - $ref: '#/components/parameters/ArchiveItemId'
      responses:
        '200':
          description: 제거 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` · `NOT_COLLABORATOR` · `COLLABORATION_CLOSED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND` · `ARCHIVE_ITEM_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/cover:
    put:
      tags: [아카이브]
      operationId: setArchiveCover
      summary: 대표 사진 지정
