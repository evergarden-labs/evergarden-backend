          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` · `NOT_COLLABORATOR` · `COLLABORATION_CLOSED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND` · `ARCHIVE_ITEM_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/items/{itemId}:
    patch:
      tags: [아카이브]
      operationId: updateArchiveItem
      summary: 배치된 항목 하나 수정
      x-user-stories: [ARCH-06, ARCH-07]
      description: |
        항목 하나의 배치·순서·캡션을 바꿉니다. 실시간 공동 편집(ARCH-12)에서
        한 사람이 사진 한 장을 옮길 때 보내는 변경 단위이기도 합니다.

        캡션은 사진 한 장에 붙이는 짧은 글입니다(ADR-029).
        `layout`만 바꿀 때와 같은 오퍼레이션을 쓰므로, 글만 고칠 때는 `caption`만 보내면 됩니다.
      parameters:
