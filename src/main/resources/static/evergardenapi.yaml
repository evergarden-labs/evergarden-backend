openapi: 3.1.0

info:
  title: EverGarden API
  version: 0.1.0-draft
  summary: 여행 아카이빙 플랫폼 에버가든의 백엔드 API

  description: |
    # 이 문서의 지위

    **이 파일은 에버가든 API의 유일한 정본(single source of truth)입니다.**
    클라이언트와 서버는 이 문서에 적힌 계약만을 근거로 구현하며,
    문서와 구현이 다르면 **구현을 고칩니다.**
    계약을 바꿔야 할 때는 코드를 먼저 고치지 말고 이 파일을 먼저 고칩니다.

    이 문서는 아래 네 문서를 근거로 작성했습니다. 근거가 없는 엔드포인트는 만들지 않습니다.

    | 근거 문서 | 위치 |
    |---|---|
    | 유저 스토리 카탈로그 | 별도 관리 (88행) |
    | ERD | 테이블 25개 |
    | 오류 코드 표 | `docs/error-codes.md` |
    | 결정 기록(ADR) | `docs/decisions.md` |

    모든 오퍼레이션에는 근거가 된 스토리 ID를 `x-user-stories`로 붙였습니다.

    ---

    # 1. 응답 봉투

    ## 성공

    모든 성공 응답은 `data`와 `meta` 두 필드를 가진 객체입니다.

    ```json
    { "data": { "...": "..." }, "meta": null }
    ```

    - `data` — 실제 응답 본문. 반환할 것이 없으면 `null`
    - `meta` — 목록의 페이지 정보 등 부가 정보. 없으면 `null`

    **본문이 없는 응답에도 `204`를 쓰지 않고 `200`에 `data: null`을 담습니다.**
    클라이언트가 응답 처리 분기를 하나로 유지할 수 있게 하기 위해서입니다.

    ## 실패

    모든 실패 응답은 `error` 하나만 가집니다. 성공 봉투와 필드가 겹치지 않습니다.

    ```json
    { "error": { "code": "TRIP_NOT_FOUND", "message": "여행 일정을 찾을 수 없습니다.", "details": null } }
    ```

    - `code` — `docs/error-codes.md`에 정의된 코드만 사용합니다. **여기 없는 코드를 새로 만들지 않습니다.**
    - `message` — 사용자에게 그대로 보여줄 수 있는 한국어 문장
    - `details` — 코드별 부가 정보. 없으면 `null`

    ---

    # 2. 인증

    JWT Bearer 토큰을 `Authorization` 헤더에 담습니다.

    ```
    Authorization: Bearer <accessToken>
    ```

    - 액세스 토큰 만료 30분, 리프레시 토큰 만료 7일
    - 소셜 로그인은 **앱 SDK 방식**입니다. 앱이 Google·Kakao·Naver SDK로 받은 토큰을
      `POST /auth/social/{provider}`에 넘기면 서버가 검증하고 자체 JWT를 발급합니다.
      서버가 소셜 로그인 페이지로 리다이렉트하지 않습니다.
    - 리프레시 토큰은 **요청 본문**으로 주고받습니다. 쿠키를 쓰지 않습니다.
    - `security`를 전역으로 걸어두었고, 인증이 필요 없는 오퍼레이션에만 `security: []`로 해제합니다.

    > **[가정] 관리자 인증**
    > 관리자(ADMIN-08)가 일반 사용자와 같은 JWT 체계를 쓰는지, 별도 세션을 쓰는지 정해지지 않았습니다.
    > 이 문서는 **같은 Bearer 스킴에 역할 클레임으로 구분**한다고 가정했습니다.
    > 결정 주체: 백엔드.

    ---

    # 3. 생략 규칙 — 오퍼레이션마다 적지 않는 응답

    아래 응답은 **전역 규칙**이며 각 오퍼레이션에 반복해 적지 않습니다.
    적혀 있지 않다고 해서 발생하지 않는다는 뜻이 아닙니다.

    | 응답 | 적용 범위 | 사용 코드 |
    |---|---|---|
    | `401` | 인증이 필요한 모든 오퍼레이션 | `UNAUTHENTICATED` · `TOKEN_EXPIRED` · `TOKEN_INVALID` |
    | `403` | 인증이 필요한 모든 오퍼레이션 | `USER_BLOCKED` · `USER_WITHDRAWN` |
    | `500` | 모든 오퍼레이션 | `INTERNAL_ERROR` |

    각 오퍼레이션에는 **그 오퍼레이션에서만 발생하는** `400` · `403` · `404` · `409` · `503`만 적습니다.
    `security: []`로 인증을 해제한 오퍼레이션은 위 `401` · `403` 규칙에서 제외됩니다.

    ---

    # 4. 목록 나누기 (페이지네이션)

    두 방식을 쓰며, 화면 성격에 따라 나눴습니다.

    ## 커서 방식 — 무한 스크롤 화면

    아카이브 목록, 타임캡슐 목록, 커뮤니티 피드에 사용합니다.

    - 요청: `cursor`(첫 페이지는 생략), `size`
    - `meta`: `{ "nextCursor": "...", "hasNext": true }`
    - `nextCursor`는 서버가 만든 불투명한 문자열입니다. 클라이언트가 해석하지 않습니다.

    ## 번호 방식 — 그 외 목록

    일정 목록, 좋아요 목록, 알림 목록, 관리자 화면에 사용합니다.

    - 요청: `page`(1부터 시작), `size`
    - `meta`: `{ "page": 1, "size": 20, "totalElements": 137, "totalPages": 7 }`

    두 방식 모두 `size` 기본값 **20**, 최대 **50**입니다.

    ---

    # 5. 확장 필드

    | 필드 | 뜻 |
    |---|---|
    | `x-user-stories` | 이 오퍼레이션의 근거가 된 유저 스토리 ID |
    | `x-implementation-status` | `not-implemented`이면 계약만 있고 구현 계획이 확정되지 않은 상태 |

    본문 안의 `[가정]` 태그는 **근거 문서에 없어 판단이 필요한 값**을 표시합니다.
    추측해서 채우지 않았으며, 무엇이 미정이고 누가 정해야 하는지 함께 적었습니다.

    ---

    # 6. 작성 진행 상황

    도메인 단위로 나누어 작성합니다.

    | 도메인 | 상태 |
    |---|---|
    | 공통 규약 · 인증 · 온보딩 · 마이페이지 | **작성 완료** |
    | 플래너 | **작성 완료** |
    | 지도 · 정원 | **작성 완료** |
    | 타임캡슐 | **작성 완료** |
    | 미디어 | **작성 완료** |
    | 아카이브 | 미작성 |
    | 커뮤니티 | 미작성 |
    | 알림 | 미작성 |
    | 관리자 | 미작성 |

servers:
  - url: https://api.evergarden.example/api/v1
    description: 운영
  - url: http://localhost:8080/api/v1
    description: 로컬 개발

security:
  - bearerAuth: []

tags:
  - name: 인증
    description: 소셜 로그인, 토큰 재발급, 로그아웃, 회원 탈퇴
  - name: 온보딩
    description: 가입 직후 초기 설정
  - name: 마이페이지
    description: 내 프로필 조회와 수정
  - name: 플래너
    description: 여행 일정(코스) 생성과 편집
  - name: 장소
    description: 한국관광 콘텐츠랩 기반 관광지 검색과 조회
  - name: 지도
    description: 지역 방문 인증과 지역별 관광 정보
  - name: 정원
    description: 방문 보상으로 모은 식물과 오브젝트
  - name: 미디어
    description: 사진·영상 업로드
  - name: 타임캡슐
    description: 조건이 충족되면 열리는 봉인 기록

paths:

  # ------------------------------------------------------------------
  # 인증
  # ------------------------------------------------------------------

  /auth/social/{provider}:
    post:
      tags: [인증]
      operationId: loginWithSocial
      summary: 소셜 로그인 · 회원가입
      x-user-stories: [AUTH-01, AUTH-02]
      security: []
      description: |
        앱이 소셜 SDK로 받은 액세스 토큰을 서버가 검증하고 자체 JWT를 발급합니다.
        가입한 적이 없는 소셜 계정이면 회원가입이 함께 일어나며(AUTH-01),
        응답의 `isNewUser`로 구분합니다.

        온보딩을 마치지 않은 사용자는 `onboardingCompleted`가 `false`이며,
        앱은 초기 설정 화면으로 보냅니다.
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socialAccessToken]
              properties:
                socialAccessToken:
                  type: string
                  description: 소셜 SDK가 발급한 액세스 토큰
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResult' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — `socialAccessToken`이 비어 있음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: |
            `SOCIAL_AUTH_FAILED` — 소셜 제공자가 토큰을 거부함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `USER_BLOCKED` — 차단된 회원 · `USER_WITHDRAWN` — 탈퇴한 회원
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `SOCIAL_ACCOUNT_ALREADY_LINKED` — 이미 다른 계정에 연결된 소셜 계정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/token/refresh:
    post:
      tags: [인증]
      operationId: refreshToken
      summary: 액세스 토큰 재발급
      x-user-stories: [AUTH-05]
      security: []
      description: |
        액세스 토큰이 만료되어 `TOKEN_EXPIRED`를 받으면 이 오퍼레이션으로 재발급합니다.
        재발급에 성공하면 앱은 중단됐던 요청을 재시도하고 이전 작업 문맥으로 돌아갑니다.

        리프레시 토큰도 함께 새로 발급합니다(rotation). 이전 리프레시 토큰은 즉시 폐기됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
                  meta: { type: 'null' }
        '401':
          description: |
            `REFRESH_TOKEN_EXPIRED` — 만료되었거나 폐기된 리프레시 토큰. 재로그인이 필요합니다
            `TOKEN_INVALID` — 서명 불일치 또는 변조
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [인증]
      operationId: logout
      summary: 로그아웃
      x-user-stories: [AUTH-03]
      description: |
        현재 사용자의 **모든** 리프레시 토큰을 폐기합니다.
        기기별로 선택 폐기하지 않는 이유는, 유저 스토리(AUTH-03)가
        "현재 로그인 세션이 종료된다"로만 되어 있고 다중 기기 관리 스토리가 없기 때문입니다.
      responses:
        '200':
          description: 로그아웃 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }

  # ------------------------------------------------------------------
  # 마이페이지 · 온보딩
  # ------------------------------------------------------------------

  /users/me:
    get:
      tags: [마이페이지]
      operationId: getMyProfile
      summary: 내 프로필 조회
      x-user-stories: [MY-01]
      description: |
        닉네임, 프로필 이미지와 내 기록 현황을 반환합니다.

        > **[가정] 기록 현황에 어떤 지표를 넣을지 정해지지 않았습니다.**
        > 유저 스토리 MY-01은 "내 기록 현황"이라고만 되어 있습니다.
        > 이 문서는 ERD에서 셀 수 있는 값 중 정원·지도 화면과 겹치지 않는
        > 아카이브 수, 여행 일정 수, 방문 지역 수 세 가지를 골랐습니다.
        > 결정 주체: 기획.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MyProfile' }
                  meta: { type: 'null' }

    patch:
      tags: [마이페이지]
      operationId: updateMyProfile
      summary: 프로필 수정
      x-user-stories: [MY-02]
      description: |
        닉네임과 프로필 이미지를 변경합니다. 보내지 않은 필드는 변경하지 않습니다.

        **온보딩 완료 처리는 하지 않습니다.** 가입 직후 초기 설정은
        `PATCH /users/me/onboarding`을 씁니다(ADR-021).
        온보딩을 마치지 않은 사용자가 이 오퍼레이션을 호출해도 프로필만 바뀝니다.

        > **[가정] 닉네임 규칙이 정해지지 않았습니다.**
        > 중복 허용 여부, 사용 가능한 문자, 금칙어 정책이 근거 문서에 없습니다.
        > 이 문서는 ERD의 `users.nickname varchar(20)`만 근거로 길이 제약만 두었고,
        > **중복 검사는 넣지 않았습니다.** 중복을 막기로 하면
        > `NICKNAME_DUPLICATED` 코드를 오류 코드 표에 추가해야 합니다.
        > 결정 주체: 기획.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MyProfile' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 닉네임 길이 위반 등 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [인증]
      operationId: withdrawMe
      summary: 회원 탈퇴
      x-user-stories: [AUTH-04]
      description: |
        계정을 탈퇴 상태로 전환하고 모든 리프레시 토큰을 폐기합니다.
        행을 삭제하지 않고 `users.status`를 `WITHDRAWN`으로 바꿉니다(ERD 설계 노트 6).

        > **[가정] 탈퇴 후 데이터 처리 정책이 정해지지 않았습니다.**
        > 유저 스토리 AUTH-04의 결과가 "정책에 따라 데이터가 처리된다"인데
        > 그 정책이 어느 문서에도 없습니다. 특히 아래 세 가지가 미정입니다.
        >
        > - 작성한 게시물과 댓글을 남길지 지울지
        > - 공동 편집 중이던 아카이브에서 어떻게 빠질지
        > - 유예 기간을 두고 복구를 허용할지
        >
        > 이 문서는 **계정 상태 전환과 토큰 폐기까지만** 계약으로 확정했습니다.
        > 결정 주체: 기획 + 법무.
      x-implementation-status: not-implemented
      responses:
        '200':
          description: 탈퇴 처리 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }

  /users/me/onboarding:
    patch:
      tags: [온보딩]
      operationId: completeOnboarding
      summary: 초기 설정
      x-user-stories: [ONB-01]
      description: |
        가입 직후 닉네임과 프로필 이미지를 입력하고 온보딩을 완료 처리합니다.
        성공하면 앱은 메인 화면으로 이동합니다.

        요청 스키마는 프로필 수정(MY-02)과 같지만 **별도 오퍼레이션입니다.**
        온보딩은 한 번만 할 수 있어 두 번째 호출이 `409`인 반면,
        프로필 수정은 몇 번이든 가능합니다(ADR-021).

        닉네임 규칙에 대한 [가정]은 `PATCH /users/me`와 동일합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: 초기 설정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MyProfile' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 닉네임 길이 위반 등 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ONBOARDING_ALREADY_COMPLETED` — 이미 온보딩을 마친 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/onboarding/skip:
    post:
      tags: [온보딩]
      operationId: skipOnboarding
      summary: 초기 설정 건너뛰기
      x-user-stories: [ONB-02]
      description: |
        초기 설정을 건너뛰고 바로 메인 화면으로 갑니다.
        온보딩은 완료로 표시되지만 닉네임은 입력받지 않습니다.

        > **[가정] 건너뛴 사용자의 닉네임을 어떻게 만들지 정해지지 않았습니다.**
        > 커뮤니티에 글을 쓰려면 표시할 이름이 있어야 하는데
        > ONB-02에는 이 내용이 없습니다.
        > 이 문서는 서버가 임의의 기본 닉네임을 생성한다고 가정했으며,
        > **형식(예: `여행자1234`)은 정하지 않았습니다.**
        > 결정 주체: 기획.
      responses:
        '200':
          description: 건너뛰기 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MyProfile' }
                  meta: { type: 'null' }
        '409':
          description: |
            `ONBOARDING_ALREADY_COMPLETED` — 이미 온보딩을 마친 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ------------------------------------------------------------------
  # 플래너 — 여행 일정(코스)
  # ------------------------------------------------------------------

  /trips:
    post:
      tags: [플래너]
      operationId: createTrip
      summary: 일정 생성
      x-user-stories: [PLAN-01]
      description: |
        여행지(복수 선택 가능)와 기간을 정해 빈 일정을 만듭니다.
        장소는 이후 `POST /trips/{tripId}/places`로 채웁니다.

        여기서 고른 여행지는 이 일정을 커뮤니티에 공유할 때
        게시물 지역 스냅샷의 재료가 됩니다(ADR-003).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripCreateRequest' }
      responses:
        '200':
          description: 생성 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 제목 누락, 여행지 미선택 등
            `INVALID_DATE_RANGE` — 시작일이 종료일보다 늦음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `REGION_NOT_FOUND` — 존재하지 않는 지역 코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    get:
      tags: [플래너]
      operationId: listTrips
      summary: 일정 목록 조회
      x-user-stories: [PLAN-11]
      description: |
        내가 만든 여행 일정을 지난 여행과 예정된 여행 구분 없이 함께 반환합니다.
        각 항목의 `status`로 앱이 나눠 표시합니다.

        번호 방식 페이지네이션입니다(ADR-011).

        > **[가정] 정렬 기준이 정해지지 않았습니다.**
        > 이 문서는 **시작일 내림차순**(가장 최근 여행이 위)으로 두었습니다.
        > 예정된 여행을 먼저 보여줘야 한다면 정렬을 바꿔야 합니다.
        > 결정 주체: 기획.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /trips/{tripId}:
    get:
      tags: [플래너]
      operationId: getTrip
      summary: 일정 상세 조회
      x-user-stories: [PLAN-03]
      description: |
        여행 기간과 일자별 방문 장소, 이동 순서를 반환합니다.
        연결된 아카이브가 있으면 `linkedArchiveId`에 담깁니다(ADR-001).
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 남의 일정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    patch:
      tags: [플래너]
      operationId: updateTrip
      summary: 일정 정보 수정
      x-user-stories: [PLAN-04]
      description: |
        일정의 제목, 기간, 여행지를 변경합니다. 보내지 않은 필드는 그대로 둡니다.
        일정에 담긴 장소를 고치는 것은 `.../places` 오퍼레이션들입니다.

        > **[가정] 기간을 줄였을 때 범위 밖으로 밀려나는 장소의 처리가 정해지지 않았습니다.**
        > 3일 일정을 2일로 줄이면 3일차 장소가 갈 곳이 없습니다.
        > 함께 삭제할지, 거부할지, 마지막 날로 옮길지 미정입니다.
        > 이 문서는 **`INVALID_REQUEST`로 거부**한다고 가정했습니다. 결정 주체: 기획.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripUpdateRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 검증 실패, 또는 남는 장소가 있는 기간 축소
            `INVALID_DATE_RANGE` — 시작일이 종료일보다 늦음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND` · `REGION_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [플래너]
      operationId: deleteTrip
      summary: 일정 삭제
      x-user-stories: [PLAN-05]
      description: |
        일정을 삭제합니다. **연결된 아카이브는 삭제되지 않고 연결만 끊깁니다**(ADR-001).
        이 일정을 공유한 게시물이 있으면 게시물은 남고 코스 참조만 사라집니다(ADR-002).
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}/places:
    post:
      tags: [플래너]
      operationId: addTripPlace
      summary: 일정에 장소 추가
      x-user-stories: [PLAN-02, PLAN-08]
      description: |
        일자를 지정해 장소를 일정에 담습니다.
        장소 검색(PLAN-06)에서 고른 경우와 주변 추천(PLAN-08)에서 고른 경우가
        같은 오퍼레이션을 씁니다 — 쓰기 동작이 동일해서 나누면 같은 기능이 두 벌 생깁니다.

        `sortOrder`를 생략하면 해당 일자의 맨 뒤에 붙습니다.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripPlaceCreateRequest' }
      responses:
        '200':
          description: 추가 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripPlace' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — `dayNumber`가 일정 기간을 벗어남
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND` · `PLACE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}/places/order:
    put:
      tags: [플래너]
      operationId: reorderTripPlaces
      summary: 방문 순서 변경
      x-user-stories: [PLAN-02, PLAN-04]
      description: |
        일정에 담긴 장소들의 일자와 순서를 한 번에 다시 매깁니다.
        드래그로 순서를 바꾸면 화면이 최종 배치를 통째로 보내고, 서버는 그대로 저장합니다.

        **부분 전송을 허용하지 않습니다.** 일정에 담긴 모든 장소를 보내야 합니다.
        일부만 보내면 나머지의 순서가 어떻게 되어야 하는지 서버가 알 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripPlaceOrderRequest' }
      responses:
        '200':
          description: 순서 변경 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 일정에 담긴 장소를 모두 보내지 않았거나 `dayNumber`가 기간을 벗어남
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND` · `TRIP_PLACE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}/places/{tripPlaceId}:
    patch:
      tags: [플래너]
      operationId: updateTripPlace
      summary: 담긴 장소 수정
      x-user-stories: [PLAN-04]
      description: |
        일정에 담긴 장소 한 건의 일자, 순서, 메모를 바꿉니다.
        여러 건의 순서를 한꺼번에 재배치할 때는 `PUT .../places/order`를 씁니다.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/TripPlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripPlaceUpdateRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripPlace' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — `dayNumber`가 일정 기간을 벗어남
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND` · `TRIP_PLACE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [플래너]
      operationId: removeTripPlace
      summary: 담긴 장소 제거
      x-user-stories: [PLAN-04]
      description: |
        일정에서 장소 한 건을 뺍니다. 관광지 자체(`places`)는 지워지지 않습니다.
        같은 일자에 남은 장소들의 순서는 서버가 다시 채웁니다.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/TripPlaceId'
      responses:
        '200':
          description: 제거 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND` · `TRIP_PLACE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}/nearby-places:
    get:
      tags: [플래너]
      operationId: listNearbyPlaces
      summary: 주변 추천 장소 조회
      x-user-stories: [PLAN-08]
      description: |
        일정에 이미 담긴 장소들을 기준으로 주변 관광지를 추천합니다.
        콘텐츠랩의 연관 관광지·위치기반 관광정보를 사용합니다.

        여기서 고른 장소를 일정에 넣는 것은 `POST /trips/{tripId}/places`입니다.

        > **[가정] 추천 기준이 정해지지 않았습니다.**
        > 어느 장소를 중심으로 할지(마지막 장소? 일자별?), 반경을 얼마로 할지,
        > 이미 담긴 장소를 제외할지가 근거 문서에 없습니다.
        > 이 문서는 `dayNumber`로 기준 일자만 받도록 두었고 반경은 정하지 않았습니다.
        > 결정 주체: 기획.
      x-implementation-status: not-implemented
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: dayNumber
          in: query
          required: false
          description: 기준으로 삼을 일자. 생략하면 일정 전체를 기준으로 합니다
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            `TOUR_API_UNAVAILABLE` — 콘텐츠랩 장애 또는 호출 한도 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}/auto-arrange:
    post:
      tags: [플래너]
      operationId: autoArrangeTrip
      summary: AI 일정 자동 생성
      x-user-stories: [PLAN-09]
      description: |
        일정에 담긴 장소들을 이동 거리가 짧아지는 순서로 다시 배치합니다.
        **장소를 추천해 주지는 않습니다** — 순서 정리까지가 이 오퍼레이션의 범위입니다(ADR-020).

        > **[가정] 세 가지가 미정입니다.**
        > ① **입력** — 이미 담긴 장소만 재배치할지, 요청 본문으로 장소 목록을 새로 받을지.
        >   이 문서는 담긴 장소를 재배치하되 `additionalPlaceIds`로 추가 입력을 허용하도록 두었습니다.
        > ② **적용 시점** — 결과를 바로 저장할지, 미리보기를 주고 사용자가 확인하면 저장할지.
        >   이 문서는 **바로 저장**한다고 가정했습니다. 되돌리기 기능은 스토리에 없습니다.
        > ③ **구현 방식** — 좌표 기반 자체 계산인지 외부 모델 호출인지.
        >   자체 계산이면 아래 `503` 응답은 발생하지 않습니다.
        > 결정 주체: ①② 기획 · ③ 백엔드.
      x-implementation-status: not-implemented
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoArrangeRequest' }
      responses:
        '200':
          description: 재배치 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 배치할 장소가 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND` · `PLACE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            `AI_SERVICE_UNAVAILABLE` — 외부 모델을 호출하는 방식으로 구현한 경우에만 발생합니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /trips/{tripId}/route:
    get:
      tags: [플래너]
      operationId: getTripRoute
      summary: 코스 시각화 데이터 조회
      x-user-stories: [PLAN-10]
      description: |
        일자별로 방문 순서대로 정렬한 좌표 목록과, 지도를 맞출 경계 상자를 반환합니다.
        앱은 이 좌표를 이어 동선을 그립니다.

        일정 상세(PLAN-03)에도 좌표가 들어 있지만, 지도만 그릴 때
        장소 설명과 메모까지 받는 것은 낭비라 조회를 나눴습니다.

        > **[가정] 이동 거리 계산 여부가 정해지지 않았습니다.**
        > "이동 반경이 한눈에 보인다"(PLAN-10)를 위해 경계 상자는 넣었지만,
        > 총 이동 거리·소요 시간을 서버가 계산해야 하는지는 미정입니다.
        > 실제 도로 거리를 내려면 외부 경로 API가 추가로 필요합니다.
        > 이 문서는 **직선 거리 합만** `totalDistanceMeters`로 두었습니다. 결정 주체: 기획.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripRoute' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TRIP_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /posts/{postId}/course/import:
    post:
      tags: [플래너]
      operationId: importSharedCourse
      summary: 공유된 코스 가져오기
      x-user-stories: [PLAN-12]
      description: |
        커뮤니티 게시물에 공유된 코스를 내 일정으로 복사합니다.
        복사본의 `originTripId`에 원본 일정 식별자가 남습니다(ADR-005).

        원본이 나중에 수정되거나 삭제돼도 복사본은 영향을 받지 않습니다.

        > **[가정] 복사본의 여행 기간을 어떻게 정할지 미정입니다.**
        > 원본 날짜를 그대로 쓰면 이미 지난 날짜가 됩니다.
        > 이 문서는 `startDate`를 선택 입력으로 받아 그날부터 일차를 다시 매기고,
        > 생략하면 원본 기간을 그대로 복사하도록 두었습니다. 결정 주체: 기획.
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: [string, 'null']
                  format: date
                  description: 복사본의 여행 시작일. 생략하면 원본 기간을 그대로 씁니다
                title:
                  type: [string, 'null']
                  maxLength: 60
                  description: 복사본 제목. 생략하면 원본 제목을 씁니다
      responses:
        '200':
          description: 복사 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TripDetail' }
                  meta: { type: 'null' }
        '404':
          description: |
            `POST_NOT_FOUND` — 게시물이 없거나 삭제됨
            `TRIP_NOT_FOUND` — 게시물에 공유된 코스가 없거나 원본이 삭제됨(ADR-002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ------------------------------------------------------------------
  # 장소 — 콘텐츠랩 관광정보
  # ------------------------------------------------------------------

  /places/search:
    get:
      tags: [장소]
      operationId: searchPlaces
      summary: 장소 검색
      x-user-stories: [PLAN-06]
      description: |
        지역이나 장소명으로 관광지를 찾습니다.
        콘텐츠랩에서 받아 `places` 테이블에 적재한 데이터를 조회하며,
        상세 정보는 별도로 짧은 TTL 캐시를 둡니다(ADR-004).

        `keyword`와 `regionCode` 중 최소 하나는 있어야 합니다.
        둘 다 없으면 전국 관광지 26만 건을 훑게 됩니다.
      parameters:
        - name: keyword
          in: query
          required: false
          description: 장소명 부분 일치
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: regionCode
          in: query
          required: false
          description: 시/도 또는 시군구 코드. 시/도를 주면 하위 시군구까지 포함합니다
          schema: { type: string }
        - name: contentTypeId
          in: query
          required: false
          description: 관광지·음식점·숙박 등 콘텐츠랩 분류 코드
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: |
            `INVALID_REQUEST` — `keyword`와 `regionCode`가 모두 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `REGION_NOT_FOUND` — 존재하지 않는 지역 코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            `TOUR_API_UNAVAILABLE` — 적재되지 않은 데이터를 콘텐츠랩에서 가져오는 중 장애
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /places/{placeId}:
    get:
      tags: [장소]
      operationId: getPlace
      summary: 장소 상세 조회
      x-user-stories: [PLAN-07]
      description: |
        일정에 넣기 전에 확인할 관광지 정보를 반환합니다.
        이름, 위치, 이미지, 주소, 연락처, 소개글이 포함됩니다.

        > **[가정] 운영 시간과 휴무일은 넣지 않았습니다.**
        > 기획서에는 "이용 시간, 휴무일"을 활용한다고 되어 있지만
        > 콘텐츠랩에서 이 정보는 콘텐츠 분류마다 필드 이름과 형식이 다릅니다.
        > 어느 분류까지 지원할지 정해지면 `PlaceDetail`에 필드를 추가합니다.
        > 결정 주체: 기획 + 백엔드.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PlaceDetail' }
                  meta: { type: 'null' }
        '404':
          description: |
            `PLACE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            `TOUR_API_UNAVAILABLE` — 상세 정보를 콘텐츠랩에서 가져오는 중 장애
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ------------------------------------------------------------------
  # 지도 — 지역 방문 인증
  # ------------------------------------------------------------------

  /region-visits:
    post:
      tags: [지도]
      operationId: verifyRegionVisit
      summary: 여행 지역 인증
      x-user-stories: [MAP-01, MAP-04]
      description: |
        현재 위치가 인증하려는 지역 안에 있는지 확인하고 방문 기록을 남깁니다.
        인증에 성공하면 정원 보상이 함께 처리되며(GARDEN-02),
        결과는 응답의 `rewardStatus`와 `POST /region-visits` 응답의 `visitId`로 확인합니다.

        **MAP-04(인증 실패)는 이 오퍼레이션의 오류 응답입니다.**
        실패하는 별도 엔드포인트를 만들 수 없어 여기에 함께 적었습니다.
        다만 "위치 권한을 허용하지 않은" 경우는 앱에서 막히므로 서버까지 오지 않습니다.

        좌표에서 지역을 판정하는 방식은 콘텐츠랩 위치기반 관광정보의 `areacode`를 채택합니다(ADR-004).
        요청에 `regionCode`를 함께 보내면 서버 판정 결과와 대조해 다르면 거절합니다.

        > **[가정] 쿨다운이 인증을 막지는 않습니다.**
        > GARDEN-02가 "7일에 한 번만 **성장에 반영**된다"이므로,
        > 7일 안에 같은 지역을 다시 인증해도 기록은 남고 `rewardStatus`만 `COOLDOWN`이 됩니다.
        > 인증 자체를 거부하기로 하면 `REGION_VISIT_COOLDOWN`을 `409`로 되살려야 합니다.
        > 결정 주체: 기획.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionVisitRequest' }
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RegionVisitResult' }
                  meta: { type: 'null' }
        '400':
          description: |
            `LOCATION_MISMATCH` — 보낸 좌표가 인증하려는 지역에 속하지 않음
            `LOCATION_ACCURACY_TOO_LOW` — 위치 정확도가 100m를 넘음(ADR-016)
            `REGION_NOT_DETERMINED` — 좌표로 지역을 판정하지 못함
            `INVALID_REQUEST` — 좌표 형식 오류 등
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `REGION_NOT_FOUND` — 존재하지 않는 지역 코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            `TOUR_API_UNAVAILABLE` — 지역 판정에 쓰는 콘텐츠랩 조회가 실패함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/regions:
    get:
      tags: [지도]
      operationId: listMyRegions
      summary: 방문 지역 확인
      x-user-stories: [MAP-02]
      description: |
        지도를 칠하는 데 필요한 데이터입니다.
        **방문한 지역만이 아니라 전체 지역을 반환하고 `visited`로 구분합니다** —
        MAP-02의 결과가 "방문한 지역이 **시각적으로 구분되어** 표시된다"이므로
        앱이 미방문 지역까지 알아야 색을 나눠 칠할 수 있습니다.

        페이지를 나누지 않습니다. 시/도는 17개, 시군구도 250개 수준이라
        한 번에 받아 지도에 칠하는 편이 낫습니다.
      parameters:
        - name: level
          in: query
          required: false
          description: 반환할 지역 단위
          schema: { type: string, enum: [SIDO, SIGUNGU], default: SIDO }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RegionVisitStatus' }
                  meta: { type: 'null' }

  /regions/{regionCode}:
    get:
      tags: [지도]
      operationId: getRegion
      summary: 지역 상세 정보 확인
      x-user-stories: [MAP-03]
      description: |
        지도에서 지역을 눌렀을 때 보여줄 정보입니다.
        지역 이름과 중심 좌표, 내 방문 여부, 그 지역에서 해금할 수 있는 정원 오브젝트를 반환합니다.

        그 지역의 관광지 목록은 `GET /regions/{regionCode}/places`에서 따로 받습니다.
      parameters:
        - $ref: '#/components/parameters/RegionCode'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RegionDetail' }
                  meta: { type: 'null' }
        '404':
          description: |
            `REGION_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /regions/{regionCode}/places:
    get:
      tags: [지도]
      operationId: listRegionPlaces
      summary: 지역별 관광 정보 조회
      x-user-stories: [MAP-03]
      description: |
        지역에 속한 관광지와 음식점을 분류별로 훑어봅니다.
        여기서 고른 장소를 일정에 넣는 것은 `POST /trips/{tripId}/places`입니다.

        > **`GET /places/search?regionCode=`와 결과가 겹칩니다.**
        > 검색(PLAN-06)은 키워드 중심이고 이 오퍼레이션은 지도에서 지역을 눌러 훑어보는
        > 진입점이라 스토리를 나눠 두었지만, 반환하는 데이터는 같습니다.
        > 두 화면의 요구가 끝까지 같으면 나중에 하나로 합칠 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/RegionCode'
        - name: contentTypeId
          in: query
          required: false
          description: 관광지·음식점·숙박 등 콘텐츠랩 분류 코드
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '404':
          description: |
            `REGION_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            `TOUR_API_UNAVAILABLE`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ------------------------------------------------------------------
  # 정원
  # ------------------------------------------------------------------

  /garden:
    get:
      tags: [정원]
      operationId: getMyGarden
      summary: 정원 조회
      x-user-stories: [GARDEN-01]
      description: |
        정원에 배치된 식물과 오브젝트, 각각의 성장 단계를 반환합니다.
        아직 해금하지 않은 것은 포함하지 않습니다 —
        어느 지역에서 무엇을 얻을 수 있는지는 `GET /regions/{regionCode}`에서 봅니다.

        > **[가정] 정원을 사용자당 하나로 두었습니다.**
        > 기획서에는 "아카이빙된 지역의 지도가 개인의 추억 정원으로 변모한다"고 되어 있어
        > 지역별 정원으로 읽힐 여지가 있으나, GARDEN-01은 "정원 메뉴에 진입한다"로
        > 단수입니다. 지역별로 나누려면 이 경로에 지역 구분이 들어가야 합니다.
        > 결정 주체: 기획.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Garden' }
                  meta: { type: 'null' }

  /region-visits/{visitId}/reward:
    get:
      tags: [정원]
      operationId: getVisitReward
      summary: 지역 보상 확인
      x-user-stories: [GARDEN-02]
      description: |
        방문 인증 한 건이 정원에 무엇을 남겼는지 확인합니다.
        처음 방문한 지역이면 오브젝트가 해금되고, 이미 해금한 지역이면 성장합니다.
        7일 쿨다운 안에 다시 인증했다면 `COOLDOWN`이며 아무것도 바뀌지 않습니다(ADR-018).

        인증 직후 결과는 `POST /region-visits` 응답에도 들어 있습니다.
        이 오퍼레이션은 보상 연출을 다시 보거나, 인증 응답을 놓쳤을 때 쓰기 위한 것입니다.
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/VisitReward' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 남의 방문 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `REGION_VISIT_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ------------------------------------------------------------------
  # 미디어
  # ------------------------------------------------------------------

  /media:
    post:
      tags: [미디어]
      operationId: uploadMedia
      summary: 사진·영상 업로드
      x-user-stories: [MEDIA-01]
      description: |
        아카이브와 타임캡슐에서 쓸 사진·영상을 올립니다.
        업로드만 하는 오퍼레이션이며, 어디에 붙일지는 각 도메인에서 `mediaId`로 지정합니다.

        한 번에 최대 20개, 사진 10MB·영상 200MB(3분)까지입니다(ADR-015).
        **앱이 올리기 전에 리사이즈하는 것을 전제로 한 값입니다** —
        원본을 그대로 올리면 1080p 영상 1분이 약 100MB라 금방 넘습니다.

        사진의 촬영 시각과 좌표는 서버가 EXIF에서 추출합니다.
        EXIF가 없거나 지워진 파일이면 `takenAt`·`lat`·`lng`가 `null`이 됩니다.

        > **[가정] 업로드 방식이 확정되지 않았습니다.**
        > 이 문서는 **서버로 직접 올리는 multipart 방식**으로 적었습니다.
        > 스토리지를 정하면서 presigned URL 방식으로 가면
        > 이 오퍼레이션은 "업로드 URL 발급"과 "업로드 완료 통보" 두 개로 갈라집니다.
        > 결정 주체: 인프라 + 백엔드.
      x-implementation-status: not-implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: binary }
      responses:
        '200':
          description: 업로드 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: 요청에 보낸 순서와 같은 순서로 반환합니다
                    items: { $ref: '#/components/schemas/Media' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_MEDIA_FORMAT` — 사진 JPEG·PNG·HEIC·WEBP / 영상 MP4·MOV 이외의 형식
            `MEDIA_TOO_LARGE` — 사진 10MB 또는 영상 200MB(3분) 초과
            `INVALID_REQUEST` — 파일이 없거나 20개를 넘음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ------------------------------------------------------------------
  # 타임캡슐
  # ------------------------------------------------------------------

  /time-capsules:
    post:
      tags: [타임캡슐]
      operationId: createTimeCapsule
      summary: 타임캡슐 생성
      x-user-stories: [TC-01]
      description: |
        글과 사진을 담고 해제 조건을 걸어 봉인합니다.
        만든 직후 상태는 `SEALED`이며, 본인도 조건이 충족되기 전에는 내용을 볼 수 없습니다.

        해제 조건은 **날짜 또는 위치 중 하나만** 지정합니다.
        둘 다 보내거나 둘 다 비우면 `INVALID_UNLOCK_CONDITION`입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeCapsuleCreateRequest' }
      responses:
        '200':
          description: 봉인 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TimeCapsuleDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_UNLOCK_CONDITION` — 해제 조건이 날짜·위치 중 하나로 정해지지 않음
            `INVALID_REQUEST` — 제목 누락, 과거 날짜 지정 등
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `MEDIA_NOT_FOUND` — 담으려는 사진·영상이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    get:
      tags: [타임캡슐]
      operationId: listTimeCapsules
      summary: 타임캡슐 목록 조회
      x-user-stories: [TC-02]
      description: |
        봉인된 것과 해제된 것을 **함께** 반환합니다. 각 항목의 `status`로 앱이 나눠 표시합니다.
        열어본 것만 따로 보려면 `GET /time-capsules/opened`를 씁니다.

        커서 방식 페이지네이션입니다(ADR-011).
        내용은 포함하지 않습니다 — 목록에서 봉인된 캡슐의 내용이 새면 안 됩니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TimeCapsuleSummary' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /time-capsules/opened:
    get:
      tags: [타임캡슐]
      operationId: listOpenedTimeCapsules
      summary: 해제 기록 조회
      x-user-stories: [TC-06]
      description: |
        열어본 타임캡슐만 최근에 연 순서로 반환합니다.
        내용을 다시 보려면 항목을 골라 `GET /time-capsules/{capsuleId}`를 호출합니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TimeCapsuleSummary' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /time-capsules/{capsuleId}:
    get:
      tags: [타임캡슐]
      operationId: getTimeCapsule
      summary: 해제 조건 확인 · 내용 다시 보기
      x-user-stories: [TC-03, TC-06]
      description: |
        해제 조건과 현재 상태를 반환합니다.

        **내용은 상태에 따라 다릅니다.**
        `SEALED`·`UNLOCKABLE`이면 `content`와 `media`가 `null`·빈 배열입니다 —
        아직 열지 않은 캡슐의 내용이 여기서 새면 타임캡슐이 성립하지 않습니다.
        `OPENED`가 되면 내용이 함께 내려와, 열어본 캡슐을 다시 볼 때(TC-06) 이 오퍼레이션을 씁니다.
      parameters:
        - $ref: '#/components/parameters/CapsuleId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TimeCapsuleDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` — 남의 타임캡슐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TIME_CAPSULE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [타임캡슐]
      operationId: deleteTimeCapsule
      summary: 타임캡슐 삭제
      x-user-stories: [TC-07]
      description: |
        타임캡슐을 삭제합니다. 본인 것만 걸린 데이터라 상태 전환이 아니라 **실제로 지웁니다**(ADR-007).
        담긴 사진·영상(`media`)은 다른 곳에서도 쓸 수 있으므로 함께 지우지 않습니다.

        봉인 상태에서도 삭제할 수 있습니다 — 열어보지 않고 없애는 것도 사용자의 선택입니다.
      parameters:
        - $ref: '#/components/parameters/CapsuleId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccess' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TIME_CAPSULE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /time-capsules/{capsuleId}/open:
    post:
      tags: [타임캡슐]
      operationId: openTimeCapsule
      summary: 타임캡슐 열기
      x-user-stories: [TC-05]
      description: |
        해제 가능 상태(`UNLOCKABLE`)인 캡슐을 열고 내용을 반환합니다.
        상태가 `OPENED`로 바뀌며 `openedAt`이 기록됩니다.

        아직 조건이 충족되지 않았으면 `CAPSULE_NOT_UNLOCKABLE`입니다.
        이미 연 캡슐은 이 오퍼레이션 대신 `GET /time-capsules/{capsuleId}`로 다시 봅니다.
      parameters:
        - $ref: '#/components/parameters/CapsuleId'
      responses:
        '200':
          description: 열기 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TimeCapsuleDetail' }
                  meta: { type: 'null' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `TIME_CAPSULE_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `CAPSULE_NOT_UNLOCKABLE` — 아직 해제 조건이 충족되지 않음. `details.unlockType`
            `CAPSULE_ALREADY_OPENED` — 이미 연 캡슐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /time-capsules/unlock-check:
    post:
      tags: [타임캡슐]
      operationId: checkLocationUnlock
      summary: 위치 해제 조건 확인
      x-user-stories: [TC-04]
      description: |
        현재 위치를 보고해 위치 조건 캡슐이 열릴 수 있는지 판정합니다.
        조건을 만족한 캡슐은 `UNLOCKABLE`로 바뀌고 알림이 발송됩니다(NOTI-01).

        **날짜 조건 캡슐에는 이 오퍼레이션이 필요 없습니다.**
        서버 배치가 매일 확인해 상태를 바꾸고 알림을 보냅니다.
        TC-04의 두 조건 중 위치 쪽만 클라이언트가 알려줘야 판정할 수 있어 이 오퍼레이션이 있습니다.

        > **[가정] 위치 판정 방식이 정해지지 않았습니다.**
        > 앱이 켜질 때만 한 번 보고할지, 백그라운드에서 지오펜싱으로 감지할지 미정입니다.
        > 배터리 소모와 위치 권한 등급(항상 허용 vs 사용 중에만)이 크게 달라집니다.
        > 호출 주기와 최소 간격도 정해지지 않아 이 문서에는 제한을 두지 않았습니다.
        > 결정 주체: 기획 + 앱.
      x-implementation-status: not-implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double }
                lng: { type: number, format: double }
      responses:
        '200':
          description: |
            판정 완료. 이번 호출로 새로 열 수 있게 된 캡슐만 반환합니다.
            해당하는 캡슐이 없으면 빈 배열입니다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TimeCapsuleSummary' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 좌표 형식 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        서버가 발급한 액세스 토큰. 만료 30분.
        관리자도 같은 스킴을 쓰되 역할 클레임으로 구분합니다([가정], 결정 주체: 백엔드).

  parameters:

    Provider:
      name: provider
      in: path
      required: true
      description: 소셜 로그인 제공자
      schema:
        type: string
        enum: [google, kakao, naver]

    Page:
      name: page
      in: query
      required: false
      description: 1부터 시작하는 페이지 번호
      schema: { type: integer, minimum: 1, default: 1 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 `meta.nextCursor`. 첫 페이지에서는 생략합니다
      schema: { type: string }

    Size:
      name: size
      in: query
      required: false
      description: 한 번에 받을 개수
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    TripPlaceId:
      name: tripPlaceId
      in: path
      required: true
      description: 일정에 담긴 장소 한 건의 식별자. 관광지 자체의 `placeId`와 다릅니다
      schema: { type: integer, format: int64 }

    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    RegionCode:
      name: regionCode
      in: path
      required: true
      description: 콘텐츠랩 areaCode 또는 sigunguCode(ADR-004)
      schema: { type: string }

    VisitId:
      name: visitId
      in: path
      required: true
      schema: { type: integer, format: int64 }

    CapsuleId:
      name: capsuleId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:

    # --- 공통 봉투 ---

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: '`docs/error-codes.md`에 정의된 코드'
              examples: [TRIP_NOT_FOUND]
            message:
              type: string
              description: 사용자에게 그대로 보여줄 수 있는 한국어 문장
            details:
              type: [object, 'null']
              description: 코드별 부가 정보. 검증 실패일 때만 형태가 고정됩니다
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      field: { type: string }
                      reason: { type: string }

    EmptySuccess:
      type: object
      description: 반환할 본문이 없는 성공 응답
      properties:
        data: { type: 'null' }
        meta: { type: 'null' }

    PageMeta:
      type: object
      description: 번호 방식 목록의 페이지 정보
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, examples: [1] }
        size: { type: integer, examples: [20] }
        totalElements: { type: integer, examples: [137] }
        totalPages: { type: integer, examples: [7] }

    CursorMeta:
      type: object
      description: 커서 방식 목록의 이어보기 정보
      required: [hasNext]
      properties:
        nextCursor:
          type: [string, 'null']
          description: 다음 요청의 `cursor`로 그대로 넣습니다. 클라이언트가 해석하지 않습니다
        hasNext: { type: boolean }

    # --- 인증 ---

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: 만료 30분
        refreshToken:
          type: string
          description: 만료 7일. 재발급 시 함께 교체됩니다

    AuthResult:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [isNewUser, onboardingCompleted]
          properties:
            isNewUser:
              type: boolean
              description: 이번 요청으로 회원가입이 일어났으면 `true`(AUTH-01), 기존 회원이면 `false`(AUTH-02)
            onboardingCompleted:
              type: boolean
              description: '`false`이면 앱이 초기 설정 화면으로 보냅니다'

    # --- 사용자 ---

    MyProfile:
      type: object
      required: [userId, nickname, onboardingCompleted]
      properties:
        userId: { type: integer, format: int64 }
        nickname:
          type: string
          maxLength: 20
        profileImageUrl:
          type: [string, 'null']
          format: uri
        onboardingCompleted: { type: boolean }
        stats:
          $ref: '#/components/schemas/MyStats'

    MyStats:
      type: object
      description: |
        내 기록 현황. **[가정]** — 어떤 지표를 보여줄지 미정이라 세 가지만 잠정 선정했습니다.
        결정 주체: 기획.
      properties:
        archiveCount:
          type: integer
          description: 내가 만든 아카이브 수
        tripCount:
          type: integer
          description: 내가 만든 여행 일정 수
        visitedRegionCount:
          type: integer
          description: 방문 인증을 마친 지역 수

    ProfileUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            **[가정]** 중복 허용 여부와 금칙어 정책이 미정이라 길이 제약만 두었습니다.
            결정 주체: 기획.
        profileImageUrl:
          type: [string, 'null']
          format: uri
          description: '`null`을 보내면 기본 이미지로 되돌립니다'

    # --- 여행 일정(코스) ---

    TripStatus:
      type: string
      enum: [UPCOMING, ONGOING, PAST]
      description: 오늘 날짜와 여행 기간을 비교해 서버가 계산합니다

    TripCreateRequest:
      type: object
      required: [title, startDate, endDate, regionCodes]
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        regionCodes:
          type: array
          minItems: 1
          description: 여행지. 복수 선택 가능합니다(PLAN-01)
          items: { type: string }

    TripUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        regionCodes:
          type: array
          minItems: 1
          items: { type: string }

    TripSummary:
      type: object
      required: [tripId, title, startDate, endDate, status, regions, placeCount]
      properties:
        tripId: { type: integer, format: int64 }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/TripStatus' }
        regions:
          type: array
          items: { $ref: '#/components/schemas/RegionSummary' }
        placeCount:
          type: integer
          description: 담긴 장소 수
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: 담긴 장소 중 첫 번째의 대표 이미지
        linkedArchiveId:
          type: [integer, 'null']
          format: int64
          description: 연결된 아카이브. 없으면 `null`(ADR-001)

    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          required: [days]
          properties:
            days:
              type: array
              description: 여행 기간만큼의 일자가 장소가 없어도 모두 들어갑니다
              items: { $ref: '#/components/schemas/TripDay' }
            originTripId:
              type: [integer, 'null']
              format: int64
              description: 남의 코스를 가져와 만든 일정이면 원본 식별자(ADR-005)

    TripDay:
      type: object
      required: [dayNumber, date, places]
      properties:
        dayNumber: { type: integer, minimum: 1, description: '여행 1일차 = 1' }
        date: { type: string, format: date }
        places:
          type: array
          description: '`sortOrder` 오름차순으로 정렬되어 있습니다'
          items: { $ref: '#/components/schemas/TripPlace' }

    TripPlace:
      type: object
      required: [tripPlaceId, place, dayNumber, sortOrder]
      properties:
        tripPlaceId:
          type: integer
          format: int64
          description: 일정에 담긴 이 한 건의 식별자. 같은 장소를 다른 날 또 담으면 다른 값입니다
        place: { $ref: '#/components/schemas/PlaceSummary' }
        dayNumber: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 1, description: 그 날의 방문 순서 }
        memo: { type: [string, 'null'] }

    TripPlaceCreateRequest:
      type: object
      required: [placeId, dayNumber]
      properties:
        placeId: { type: integer, format: int64 }
        dayNumber: { type: integer, minimum: 1 }
        sortOrder:
          type: [integer, 'null']
          minimum: 1
          description: 생략하면 해당 일자의 맨 뒤에 붙습니다
        memo: { type: [string, 'null'], maxLength: 500 }

    TripPlaceUpdateRequest:
      type: object
      description: 보내지 않은 필드는 변경하지 않습니다
      minProperties: 1
      properties:
        dayNumber: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 1 }
        memo: { type: [string, 'null'], maxLength: 500 }

    TripPlaceOrderRequest:
      type: object
      required: [items]
      description: 일정에 담긴 **모든** 장소를 보내야 합니다. 부분 전송은 거부됩니다
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [tripPlaceId, dayNumber, sortOrder]
            properties:
              tripPlaceId: { type: integer, format: int64 }
              dayNumber: { type: integer, minimum: 1 }
              sortOrder: { type: integer, minimum: 1 }

    AutoArrangeRequest:
      type: object
      description: |
        본문 없이 호출하면 일정에 이미 담긴 장소만 재배치합니다.
        **[가정]** 이 입력 형태는 확정되지 않았습니다 — `POST /trips/{tripId}/auto-arrange` 설명 참고.
      properties:
        additionalPlaceIds:
          type: array
          description: 재배치와 함께 새로 담을 장소들
          items: { type: integer, format: int64 }

    TripRoute:
      type: object
      required: [tripId, days]
      properties:
        tripId: { type: integer, format: int64 }
        days:
          type: array
          items:
            type: object
            required: [dayNumber, points]
            properties:
              dayNumber: { type: integer, minimum: 1 }
              points:
                type: array
                description: 방문 순서대로 정렬된 좌표
                items:
                  type: object
                  required: [sortOrder, lat, lng, title]
                  properties:
                    sortOrder: { type: integer, minimum: 1 }
                    tripPlaceId: { type: integer, format: int64 }
                    lat: { type: number, format: double }
                    lng: { type: number, format: double }
                    title: { type: string }
              totalDistanceMeters:
                type: [integer, 'null']
                description: |
                  그 날 이동 거리의 합. **[가정]** 직선 거리 기준입니다.
                  실제 도로 거리가 필요하면 외부 경로 API를 붙여야 합니다
        boundingBox:
          type: object
          description: 지도를 이 범위에 맞추면 동선 전체가 들어옵니다
          required: [minLat, minLng, maxLat, maxLng]
          properties:
            minLat: { type: number, format: double }
            minLng: { type: number, format: double }
            maxLat: { type: number, format: double }
            maxLng: { type: number, format: double }

    # --- 지역 · 장소 ---

    RegionSummary:
      type: object
      required: [code, name, level]
      properties:
        code:
          type: string
          description: 콘텐츠랩 areaCode / sigunguCode 원본(ADR-004)
        name: { type: string }
        level: { type: string, enum: [SIDO, SIGUNGU] }

    PlaceSummary:
      type: object
      required: [placeId, title, lat, lng, region]
      properties:
        placeId: { type: integer, format: int64 }
        contentId:
          type: string
          description: 콘텐츠랩 contentid
        contentTypeId:
          type: [string, 'null']
          description: 관광지·음식점·숙박 등 분류 코드
        title: { type: string }
        thumbnailUrl: { type: [string, 'null'], format: uri }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        region: { $ref: '#/components/schemas/RegionSummary' }

    PlaceDetail:
      allOf:
        - $ref: '#/components/schemas/PlaceSummary'
        - type: object
          properties:
            addr: { type: [string, 'null'] }
            tel: { type: [string, 'null'] }
            overview:
              type: [string, 'null']
              description: 콘텐츠랩 소개글
            imageUrls:
              type: array
              description: 관광 사진 정보에서 받은 공공저작물 이미지
              items: { type: string, format: uri }

    # --- 지도 · 방문 인증 ---

    RegionVisitRequest:
      type: object
      required: [lat, lng, accuracyMeters]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracyMeters:
          type: number
          description: |
            단말이 좌표와 함께 알려주는 정확도(iOS `horizontalAccuracy`, Android `getAccuracy()`).
            100m를 넘으면 거절합니다(ADR-016)
        regionCode:
          type: [string, 'null']
          description: |
            앱이 판단한 현재 지역. 보내면 서버 판정 결과와 대조하고,
            다르면 `LOCATION_MISMATCH`로 거절합니다. 생략하면 서버 판정을 그대로 씁니다

    RewardStatus:
      type: string
      enum: [UNLOCKED, GROWN, COOLDOWN, NONE]
      description: |
        `UNLOCKED` 처음 방문해 오브젝트 해금 · `GROWN` 기존 오브젝트가 성장 ·
        `COOLDOWN` 7일 안에 재인증이라 변화 없음 · `NONE` 그 지역에 지정된 오브젝트가 없음

    RegionVisitResult:
      type: object
      required: [visitId, region, verifiedAt, isFirstVisit, rewardStatus]
      properties:
        visitId: { type: integer, format: int64 }
        region: { $ref: '#/components/schemas/RegionSummary' }
        verifiedAt: { type: string, format: date-time }
        isFirstVisit: { type: boolean }
        rewardStatus: { $ref: '#/components/schemas/RewardStatus' }
        reward:
          oneOf:
            - $ref: '#/components/schemas/VisitReward'
            - type: 'null'
          description: 보상 상세. `rewardStatus`가 `NONE`이면 `null`

    RegionVisitStatus:
      type: object
      required: [region, visited]
      properties:
        region: { $ref: '#/components/schemas/RegionSummary' }
        visited: { type: boolean }
        visitCount: { type: integer, description: 인증 횟수 }
        lastVisitedAt: { type: [string, 'null'], format: date-time }

    RegionDetail:
      allOf:
        - $ref: '#/components/schemas/RegionSummary'
        - type: object
          properties:
            centerLat: { type: number, format: double }
            centerLng: { type: number, format: double }
            visited: { type: boolean }
            visitCount: { type: integer }
            availableGardenObjects:
              type: array
              description: 이 지역에서 얻을 수 있는 식물·오브젝트
              items: { $ref: '#/components/schemas/GardenObject' }

    # --- 정원 ---

    GardenObjectType:
      type: string
      enum: [PLANT, OBJECT]

    GardenObject:
      type: object
      description: 도감 정보. 사용자가 가졌는지와 무관한 마스터 데이터입니다
      required: [gardenObjectId, name, type, maxStage]
      properties:
        gardenObjectId: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/GardenObjectType' }
        imageUrl: { type: [string, 'null'], format: uri }
        maxStage: { type: integer, minimum: 1, description: 더 자랄 수 없는 단계 }
        region:
          oneOf:
            - $ref: '#/components/schemas/RegionSummary'
            - type: 'null'
          description: 지역 전용이면 해당 지역, 공통이면 `null`

    Garden:
      type: object
      required: [objects, unlockedCount, totalCount]
      properties:
        objects:
          type: array
          items: { $ref: '#/components/schemas/UserGardenObject' }
        unlockedCount: { type: integer, description: 해금한 오브젝트 수 }
        totalCount: { type: integer, description: 도감 전체 오브젝트 수 }

    UserGardenObject:
      type: object
      required: [userGardenObjectId, gardenObject, stage]
      properties:
        userGardenObjectId: { type: integer, format: int64 }
        gardenObject: { $ref: '#/components/schemas/GardenObject' }
        stage: { type: integer, minimum: 1, description: 현재 성장 단계 }
        positionX: { type: [integer, 'null'], description: 정원 안 배치 좌표 }
        positionY: { type: [integer, 'null'] }
        unlockedAt: { type: string, format: date-time }
        lastGrownAt: { type: [string, 'null'], format: date-time }

    VisitReward:
      type: object
      required: [visitId, region, rewardStatus]
      properties:
        visitId: { type: integer, format: int64 }
        region: { $ref: '#/components/schemas/RegionSummary' }
        rewardStatus: { $ref: '#/components/schemas/RewardStatus' }
        gardenObject:
          oneOf:
            - $ref: '#/components/schemas/GardenObject'
            - type: 'null'
        previousStage:
          type: [integer, 'null']
          description: 성장 전 단계. 해금이면 `null`
        currentStage: { type: [integer, 'null'] }
        nextAvailableAt:
          type: [string, 'null']
          format: date-time
          description: '`rewardStatus`가 `COOLDOWN`일 때 다음 성장 가능 시각(ADR-018)'

    # --- 미디어 ---

    MediaType:
      type: string
      enum: [IMAGE, VIDEO]

    Media:
      type: object
      required: [mediaId, type, url]
      properties:
        mediaId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/MediaType' }
        url: { type: string, format: uri }
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: 영상은 첫 프레임에서 뽑습니다
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationMs:
          type: [integer, 'null']
          description: 영상만 채워집니다
        sizeBytes: { type: integer }
        takenAt:
          type: [string, 'null']
          format: date-time
          description: EXIF 촬영 시각. 없으면 `null`
        lat:
          type: [number, 'null']
          format: double
          description: EXIF 촬영 좌표. 없으면 `null`
        lng: { type: [number, 'null'], format: double }
        createdAt: { type: string, format: date-time }

    # --- 타임캡슐 ---

    TimeCapsuleStatus:
      type: string
      enum: [SEALED, UNLOCKABLE, OPENED]
      description: |
        `SEALED` 조건 미충족 · `UNLOCKABLE` 조건 충족, 아직 열지 않음 · `OPENED` 열어봄

    UnlockType:
      type: string
      enum: [DATE, LOCATION]

    UnlockCondition:
      type: object
      required: [type, satisfied]
      properties:
        type: { $ref: '#/components/schemas/UnlockType' }
        satisfied:
          type: boolean
          description: 지금 조건이 충족된 상태인지
        unlockDate:
          type: [string, 'null']
          format: date
          description: '`type`이 `DATE`일 때만 채워집니다'
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        radiusMeters:
          type: [integer, 'null']
          description: '`type`이 `LOCATION`일 때만 채워집니다'
        placeName:
          type: [string, 'null']
          description: 사용자가 알아볼 수 있게 저장해 둔 장소 이름

    TimeCapsuleCreateRequest:
      type: object
      required: [title, content, unlockType]
      description: 해제 조건은 날짜와 위치 중 **하나만** 지정합니다
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        content: { type: string, minLength: 1, maxLength: 5000 }
        unlockType: { $ref: '#/components/schemas/UnlockType' }
        unlockDate:
          type: [string, 'null']
          format: date
          description: '`unlockType`이 `DATE`일 때 필수. 오늘보다 뒤여야 합니다'
        unlockLat: { type: [number, 'null'], format: double }
        unlockLng: { type: [number, 'null'], format: double }
        unlockRadiusMeters:
          type: [integer, 'null']
          minimum: 50
          description: '`unlockType`이 `LOCATION`일 때 필수'
        placeName: { type: [string, 'null'], maxLength: 60 }
        mediaIds:
          type: array
          description: '`POST /media`로 먼저 올린 사진·영상의 식별자'
          items: { type: integer, format: int64 }

    TimeCapsuleSummary:
      type: object
      description: 목록용. **내용을 포함하지 않습니다**
      required: [capsuleId, title, status, unlockType, createdAt]
      properties:
        capsuleId: { type: integer, format: int64 }
        title: { type: string }
        status: { $ref: '#/components/schemas/TimeCapsuleStatus' }
        unlockType: { $ref: '#/components/schemas/UnlockType' }
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: 열어본 캡슐만 채워집니다. 봉인 상태에서는 `null`
        createdAt: { type: string, format: date-time }
        openedAt: { type: [string, 'null'], format: date-time }

    TimeCapsuleDetail:
      allOf:
        - $ref: '#/components/schemas/TimeCapsuleSummary'
        - type: object
          required: [unlockCondition]
          properties:
            unlockCondition: { $ref: '#/components/schemas/UnlockCondition' }
            content:
              type: [string, 'null']
              description: '**`status`가 `OPENED`일 때만 채워집니다.** 그 전에는 `null`'
            media:
              type: array
              description: '**`status`가 `OPENED`일 때만 채워집니다.** 그 전에는 빈 배열'
              items: { $ref: '#/components/schemas/Media' }
