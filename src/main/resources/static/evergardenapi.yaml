        '404':
          description: |
            `ARCHIVE_NOT_FOUND` · `MEDIA_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/items/layout:
    put:
      tags: [아카이브]
      operationId: updateArchiveLayout
      summary: 레이아웃·순서 일괄 변경
      x-user-stories: [ARCH-07]
      description: |
        배치와 순서를 한 번에 다시 정합니다.
        화면이 편집을 마친 최종 배치를 통째로 보내고, 서버는 그대로 저장합니다.

        **부분 전송을 허용하지 않습니다.** 아카이브의 모든 항목을 보내야 합니다 —
        일부만 보내면 나머지의 순서가 어떻게 되어야 하는지 서버가 알 수 없습니다.
        항목 하나만 고칠 때는 `PATCH .../items/{itemId}`를 씁니다.
      parameters:
