                  format: int64
                  description: 아카이브에 배치된 항목의 식별자
      responses:
        '200':
          description: 지정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ArchiveDetail' }
                  meta: { type: 'null' }
        '400':
          description: |
            `INVALID_REQUEST` — 영상을 대표로 지정하려 함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `NOT_RESOURCE_OWNER` · `NOT_COLLABORATOR` · `COLLABORATION_CLOSED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            `ARCHIVE_NOT_FOUND` · `ARCHIVE_ITEM_NOT_FOUND`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /archives/{archiveId}/trip:
    put:
      tags: [아카이브]
      operationId: linkTripToArchive
      summary: 여행 일정 연결
      x-user-stories: [ARCH-17]
      description: |
        아카이브에 여행 일정을 잇습니다. 이미 다른 일정이 연결돼 있으면 교체합니다.
        일정 하나에는 아카이브 하나만 붙습니다(ADR-001).
      parameters:
