# 로컬 개발용 PostgreSQL · Redis
#
#   docker compose up -d      켜기
#   docker compose down       끄기
#   docker compose down -v    데이터까지 지우고 끄기
#
# 버전은 통합 테스트(support/ContainerConfig)와 맞춰 둔다.
# 로컬에서 되던 것이 CI에서 깨지는 일을 줄이기 위해서다.

services:
  postgres:
    image: postgres:16-alpine
    container_name: evergarden-postgres
    ports:
      # 127.0.0.1로 묶어 내 컴퓨터에서만 접속되게 한다.
      # 0.0.0.0이면 같은 네트워크의 다른 사람도 이 계정으로 붙을 수 있다
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: evergarden
      POSTGRES_USER: evergarden
      POSTGRES_PASSWORD: evergarden
      # 스키마는 Flyway가 만든다. 여기서 초기화 SQL을 넣지 않는다
    volumes:
      - evergarden-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evergarden -d evergarden"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: evergarden-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evergarden-postgres:
