# EC2 운영 배포용. 로컬 개발은 docker-compose.yml(Postgres·Redis만)을 그대로 쓴다.
#
# Postgres는 여기서 안 띄운다 — RDS(관리형)를 쓴다. 자동 백업·PITR이 기본으로
# 되고, 이 인스턴스의 메모리를 앱·Redis·Caddy가 나눠 쓰는 데도 여유가 생긴다.
# Redis는 리프레시 토큰만 담는 낮은 중요도라 그대로 이 인스턴스에서 띄운다.
#
# app 이미지는 여기서 빌드하지 않는다 — GitHub Actions의 호스팅 러너가 빌드해서
# GHCR에 올려두고, 여기서는 pull만 한다(scripts/deploy.sh). EC2가 직접 빌드하지
# 않으니, EC2에만 있는 application.properties(git에 안 올라가는 실제 비밀값)가
# 이미지 빌드 과정에 전혀 끼지 않는다 — 그래서 레지스트리에 올라가는 이미지에
# 비밀값이 안 박힌다. 대신 컨테이너를 "실행"할 때 env_file로 그 비밀값을 주입한다.
#
# 환경변수는 여전히 src/main/resources/application.properties 하나에 모은다 —
# .env는 안 둔다. 이 파일을 env_file로 그대로 재사용한다(Docker Compose의
# env_file 포맷이 KEY=VALUE·주석(#)을 그대로 지원해서 손댈 필요가 없다).
#
# 실행 전 체크리스트:
#   1. application.properties의 DB_URL을 RDS 엔드포인트로 채운다
#      (jdbc:postgresql://<RDS 엔드포인트>:5432/evergarden)
#   2. EC2의 보안 그룹에서 RDS로 5432 아웃바운드가 막혀 있지 않은지,
#      RDS 보안 그룹이 이 EC2 인스턴스에서 들어오는 5432를 허용하는지 확인
#   3. Caddyfile이 로컬에 있는지 확인(.gitignore 대상이라 서버에서 직접 만들어야 함)
#   4. 패키지는 비공개다(organization이 Public을 막아둠) — 수동으로 pull하려면
#      먼저 `docker login ghcr.io`가 돼 있어야 한다. deploy.yml의 deploy job은
#      GITHUB_TOKEN으로 자동 로그인하니 평소엔 신경 안 써도 된다.
#
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# app은 blue/green 두 개로 떠 있다(scripts/deploy.sh). 평소엔 둘 중 하나만
# 켜져 있고, 배포할 때만 꺼져 있던 쪽을 새 이미지로 잠깐 같이 띄워서 헬스체크
# 통과시킨 뒤 Caddy를 그쪽으로 돌리고, 그제서야 이전 쪽을 끈다 — 그래서
# "구버전 종료 → 신버전 기동" 사이의 공백이 없다. 두 서비스는 완전히 대칭이라
# 설정이 똑같고 container_name·서비스 이름만 다르다.
#
# name을 따로 줘서 docker-compose.yml(로컬 dev용)과 프로젝트 자체를 분리한다.
# 실제로 겪은 문제라 반드시 필요하다 — Compose는 컨테이너를 "프로젝트 + 서비스 이름"으로
# 추적하는데, 두 compose 파일이 같은 디렉터리에 있으면 기본 프로젝트명이 같아져서
# service: redis가 "같은 컨테이너"로 취급되어 dev 컨테이너가 지워지고
# prod 것으로 교체되는 걸 직접 겪었다.
name: evergarden-prod

services:
  redis:
    image: redis:7-alpine
    container_name: evergarden-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-blue:
    image: ghcr.io/evergarden-labs/evergarden-backend:latest
    container_name: evergarden-app-blue
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # DB_URL은 RDS 엔드포인트를 가리킨다 — 이 컨테이너 네트워크 밖(VPC)으로 나가는 평범한
    # 외부 연결이라 Postgres 서비스처럼 depends_on으로 묶을 대상이 없다.
    # AWS 자격증명은 여기 안 넣는다 — EC2 인스턴스 역할로 해결한다(S3Config 참고).
    env_file:
      # 이미지 안에 비밀값이 없으니(위 설명 참고), 컨테이너를 띄우는 지금 이 시점에
      # EC2의 실제 application.properties에서 읽어 환경변수로 주입한다.
      - src/main/resources/application.properties
    environment:
      # application.yml의 기본 프로필은 dev다. 명시하지 않으면 운영에서도 dev로
      # 뜨면서 application.properties의 값 대신 로컬 기본값(localhost 등)을 보게 된다.
      - SPRING_PROFILES_ACTIVE=prod

  app-green:
    image: ghcr.io/evergarden-labs/evergarden-backend:latest
    container_name: evergarden-app-green
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - src/main/resources/application.properties
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  caddy:
    image: caddy:2-alpine
    container_name: evergarden-caddy-prod
    restart: unless-stopped
    # app-blue/app-green 둘 다는 안 적는다 — `docker compose up -d`를 인자 없이
    # 치면 depends_on에 적힌 서비스까지 전부 같이 띄워버린다. 평소엔 둘 중
    # 하나만 켜져 있어야 하니, deploy.sh가 매번 띄울 쪽을 직접 지정한다
    # (예: `docker compose up -d app-green`). Caddy는 reverse_proxy 대상에
    # 연결을 요청 시점에 맺으니 시작 순서를 강제할 필요도 없다.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data-prod:/data
      - caddy-config-prod:/config

volumes:
  caddy-data-prod:
  caddy-config-prod:
