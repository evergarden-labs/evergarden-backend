name: CI

# main으로 가는 PR마다 테스트를 돌린다. Testcontainers가 실제 PostgreSQL·Redis
# 컨테이너를 띄우는데, ubuntu-latest 러너에는 Docker가 기본 설치돼 있어
# 별도 설정 없이 그대로 동작한다.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test
