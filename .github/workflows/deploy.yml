name: Deploy

# main에 머지되면 GHCR에 이미지를 새로 올리고, 그걸 EC2가 받아서 재기동한다.
#
# 빌드(build-and-push)는 GitHub가 주는 공용 러너(ubuntu-latest)에서 돈다 — EC2가
# 직접 빌드하지 않는다. EC2에만 있는 application.properties(git에 안 올라가는
# 실제 비밀값)가 이 러너엔 없으니(체크아웃만 하므로), 레지스트리에 올라가는
# 이미지에 비밀값이 섞일 일이 없다.
#
# 배포(deploy)는 EC2 안에 설치한 self-hosted 러너에서 돈다. SSH로 외부에서
# 접속할 필요가 없다 — 이 러너가 GHCR로 나가는(아웃바운드) 연결만 만들어서
# 이미지를 받아오고, 재기동도 그 인스턴스 안에서 직접 한다. 보안 그룹에
# SSH(22번)를 열어 두지 않아도 된다.
#
# 패키지는 Public으로 안 돌린다 — organization 차원에서 막혀 있다. 대신 pull
# 전에 GITHUB_TOKEN으로 짧게 로그인한다. 이 토큰은 워크플로 실행마다 새로
# 발급되는 임시 토큰이라, 장기 시크릿을 따로 안 만들어도 된다.
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      packages: read
    steps:
      - name: GHCR 로그인 (패키지가 비공개라 pull에 필요)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 최신 코드 받기
        # deploy.sh 안에서 git pull을 하면, 실행 중인 그 스크립트 파일 자신을
        # 덮어쓰게 된다 — 리눅스에서는 실행 중인 파일이 교체돼도 이미 열어서
        # 읽던 프로세스는 옛 내용을 계속 읽기 때문에, 스크립트 뒷부분이 업데이트
        # 전 내용으로 실행되는 사고가 실제로 있었다. 그래서 git pull은 deploy.sh를
        # "실행하기 전에" 별도 단계로 분리한다.
        run: cd ~/evergarden-backend && git pull origin main

      - name: Deploy
        run: ~/evergarden-backend/scripts/deploy.sh
