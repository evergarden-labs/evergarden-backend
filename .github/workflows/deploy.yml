name: Deploy

# main에 머지되면 바로 배포한다.
#
# EC2 안에 설치한 self-hosted 러너에서 돈다 — GitHub가 주는 공용 러너(ubuntu-latest)가
# 아니다. 그래서 SSH로 외부에서 접속할 필요가 없다. 러너가 GitHub로 나가는(아웃바운드)
# 연결만 만들고, 배포 스크립트도 그 인스턴스 안에서 직접 실행된다 — 보안 그룹에
# SSH(22번)를 열어 두지 않아도 된다.
#
# 코드를 새로 받는 건 scripts/deploy.sh 안의 git pull이 하므로, actions/checkout은
# 여기서 쓰지 않는다 — 러너의 작업 디렉터리가 아니라 실제 배포 경로(~/evergarden-backend)
# 에서 받아야 한다.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: ~/evergarden-backend/scripts/deploy.sh
